<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UML-Trainer LF11</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d2433; --muted:#5d6577; --line:#d9d6cc;
  --accent:#2f5bd3; --on-accent:#ffffff; --accent-soft:#e6ecfb; --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#c23b3b; --bad-soft:#fbe7e7;
  --warn:#9a6a00; --warn-soft:#fbf1d6; --code:#f0eee7;
  --uc:#2f5bd3; --cl:#7a3fc4; --st:#c2410c; --ac:#0f8a7a; --sq:#b4235a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --card:#1d2029; --ink:#e7e9ef; --muted:#a0a6b5; --line:#343846;
    --accent:#7d9cff; --on-accent:#10131c; --accent-soft:#232c45; --ok:#4cc483; --ok-soft:#18301f; --bad:#ff7a7a; --bad-soft:#3a1d1f;
    --warn:#e6b84a; --warn-soft:#352c14; --code:#262a35;
    --uc:#7d9cff; --cl:#b98cf5; --st:#f08a54; --ac:#3fc9b5; --sq:#f06b9b;
  }
}
:root[data-theme="dark"]{
  --bg:#14161c; --card:#1d2029; --ink:#e7e9ef; --muted:#a0a6b5; --line:#343846;
  --accent:#7d9cff; --on-accent:#10131c; --accent-soft:#232c45; --ok:#4cc483; --ok-soft:#18301f; --bad:#ff7a7a; --bad-soft:#3a1d1f;
  --warn:#e6b84a; --warn-soft:#352c14; --code:#262a35;
  --uc:#7d9cff; --cl:#b98cf5; --st:#f08a54; --ac:#3fc9b5; --sq:#f06b9b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:285px 1fr;min-height:100vh}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:750;font-size:19px;padding:4px 10px 2px}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.navgroup{margin-top:16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 10px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;font:inherit;font-size:15px;cursor:pointer}
.navbtn:hover{background:var(--accent-soft)}
.navbtn.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.navbtn .pct{margin-left:auto;font-size:12px;color:var(--muted)}
main{padding:28px 36px 60px;max-width:1080px;width:100%}
h1{font-size:28px;margin:0 0 4px;line-height:1.2}
h2{font-size:21px;margin:28px 0 10px}
h3{font-size:17px;margin:20px 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;border-top:4px solid var(--c,var(--accent));transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile h3{margin:0 0 4px}
.tile p{margin:0;color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--c,var(--accent))}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:16px 0 4px}
.tab{border:0;background:none;font:inherit;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);border-color:var(--c,var(--accent));font-weight:650}
.lead{font-size:17px}
.de{font-weight:650}
.q-box{border-left:4px solid var(--c,var(--accent));background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em}
.notation{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.nitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.nitem svg{width:100%;height:auto;aspect-ratio:150/66;max-height:130px;background:var(--bg);border-radius:8px}
.nitem b{display:block}
.nitem span{font-size:14px;color:var(--muted)}
svg.sym text{fill:var(--ink);stroke:none;font-family:system-ui,sans-serif}
svg .s{stroke:var(--ink);fill:none;stroke-width:1.4}
svg .d{stroke-dasharray:5 3}
svg .f{fill:var(--ink);stroke:var(--ink)}
svg .w{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
svg .acc{fill:var(--accent);stroke:none}
marker .mk{stroke:var(--ink);fill:none;stroke-width:1.3}
marker .mkf{fill:var(--ink);stroke:var(--ink)}
marker .mkw{fill:var(--card);stroke:var(--ink);stroke-width:1.3}
.figure{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0;text-align:center}
.figure img{max-width:100%;height:auto;cursor:zoom-in}
.figcap{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}
.bigsvg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0;overflow-x:auto}
.bigsvg svg{display:block;margin:auto;max-width:100%;height:auto}
.mist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbad{background:var(--bad-soft);border-radius:10px;padding:10px 12px}
.mgood{background:var(--ok-soft);border-radius:10px;padding:10px 12px}
.mbad b{color:var(--bad)} .mgood b{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:9px 16px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:11px 14px;border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.expl{padding:10px 14px;border-radius:10px;background:var(--warn-soft);margin-top:8px}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.qtext{font-size:18px;font-weight:600;margin:6px 0}
.qsvg{background:var(--bg);border-radius:10px;padding:10px;display:flex;justify-content:center;margin:10px 0}
.qsvg svg{width:260px;height:115px}
.result{text-align:center;padding:26px}
.result .big{font-size:46px;font-weight:800}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.sol{display:none}
.sol.show{display:block}
.flash{perspective:900px;max-width:520px;margin:16px auto}
.flash-inner{position:relative;height:230px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .t{font-size:24px;font-weight:750}
.face .h{color:var(--muted);font-size:13px;margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.compare td:first-child{font-weight:650;white-space:nowrap}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.topbar{display:none}
.themebtn{margin:18px 10px 0;font-size:13px}
ul.clean{padding-left:20px;margin:6px 0}
ul.clean li{margin:4px 0}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 8px;display:flex;overflow-x:auto;gap:4px;white-space:nowrap}
  nav.side .brand,nav.side .navgroup,.themebtn{display:none}
  .navbtn{width:auto;flex:none;padding:8px 10px}
  .navbtn .pct{display:none}
  main{padding:18px 16px 50px}
  .mrow{grid-template-columns:1fr}
  h1{font-size:23px}
}

/* ---------- Übungseditor ---------- */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:650}
select,input[type=text],textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;resize:vertical}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ed{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:12px 0}
.ed-tools{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.ed-tools .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.tool{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:650}
.tool.edge{border-style:dashed}
.ed-hint{padding:6px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.ed-main{display:grid;grid-template-columns:minmax(0,1fr) 250px}
.ed-canvas{overflow:auto;max-height:680px;min-height:420px;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 24px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 100%,var(--card);background-blend-mode:normal}
.ed-canvas svg{display:block;max-width:none;touch-action:pan-x pan-y}
.ed-canvas svg .nd{cursor:move}
.ed-canvas svg .eg{cursor:pointer}
.ed-canvas svg.adding{cursor:crosshair}
.ed-side{border-left:1px solid var(--line);padding:12px;font-size:14px;min-width:0}
.ed-side label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.ed-side input[type=text],.ed-side select{width:100%}
.hint{color:var(--muted);font-size:13px;margin:0}
svg .selx{stroke:var(--accent)!important;stroke-width:2.6!important}
svg .hl{stroke:var(--bad)!important;stroke-width:3!important}
svg.sym text.lbl{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
svg .hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke}
svg .lanehead{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.4}
svg .handle{fill:var(--accent);stroke:none;cursor:nwse-resize;touch-action:none}
.sqb{padding:12px;border-top:1px solid var(--line)}
.sqrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 0;border-bottom:1px dashed var(--line)}
.sqrow.hlrow{background:var(--bad-soft)}
.sqrow input[type=text]{flex:1;min-width:120px}
.sqrow .mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit;font-size:13px}
.sqrow .tag{font-size:12px;font-weight:700;color:var(--accent);min-width:74px}
.find{display:flex;gap:10px;padding:8px 12px;border-radius:9px;margin:6px 0;cursor:pointer;align-items:flex-start}
.find.err{background:var(--bad-soft)} .find.warn{background:var(--warn-soft)} .find.tip{background:var(--accent-soft)} .find.ok{background:var(--ok-soft);cursor:default}
.find b{flex:none}
.score{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.score .num{font-size:34px;font-weight:800}
.aibox{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px;margin:14px 0}
.aimsg{padding:10px 12px;border-radius:10px;margin:8px 0;background:var(--bg)}
.aimsg.me{background:var(--accent-soft)}
.aimsg p{margin:6px 0}.aimsg ul,.aimsg ol{margin:6px 0;padding-left:22px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin-left:6px}
.lvl{font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .ed-main{grid-template-columns:1fr}
  .ed-side{border-left:0;border-top:1px solid var(--line)}
  .ed-canvas{max-height:460px;min-height:320px}
}
pre.code{background:var(--code);border-radius:10px;padding:12px 14px;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-x:auto;margin:10px 0;white-space:pre}
.bigsvg.dg{max-height:none}
.bigsvg.dg svg{max-width:100%;height:auto}
svg.pick .nd,svg.pick .eg{cursor:pointer}
svg.pick .nd:hover .w,svg.pick .eg:hover .s{stroke:var(--accent)}
/* ---------- Aufgabensammlung + Prüfung ---------- */
.kinds{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));margin:12px 0}
.kind{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:12px;border-radius:12px;cursor:pointer}
.kind .ic{font-size:20px}
.kind.on{border-color:var(--accent);background:var(--accent-soft)}
.tlist{display:grid;gap:10px}
.titem{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.titem .grow{flex:1;min-width:200px}
.stmt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;flex-wrap:wrap}
.stmt .tx{flex:1;min-width:220px}
.stmt .why{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.stmt.ok{background:var(--ok-soft);border-color:var(--ok)}.stmt.bad{background:var(--bad-soft);border-color:var(--bad)}
.tf{display:flex;gap:6px}
.tf button,.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:14px}
.tf button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:650}
.tf button:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
textarea.oans{font-family:inherit;font-size:15px;margin-top:8px}
.kwp{display:inline-block;padding:1px 8px;border-radius:20px;margin:2px 2px;font-size:12px}
.kwp.ok{background:var(--ok-soft);color:var(--ok)}.kwp.no{background:var(--bad-soft);color:var(--bad)}
.exbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.exbar .timer{font:700 20px ui-monospace,Consolas,monospace}
.exbar .timer.low{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{min-width:36px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;cursor:pointer}
.chip.done{background:var(--ok-soft);border-color:var(--ok)}
.chip.cur{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.card table{margin:8px 0}
.findfig svg .nd,.findfig svg .eg,.findfig svg .ph{cursor:pointer}
.tscroll{overflow-x:auto;max-width:100%}
.ed-canvas svg.adding{touch-action:none}
.sqd>summary{padding:10px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.sqd .sqb{border-top:1px solid var(--line)}
#sqprev{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;fill:none;pointer-events:none}
.ed-canvas svg .ph{cursor:grab}
/* ---------- Bausteine ziehen und Linien verbinden ---------- */
.tool.pal{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
body.paldrag,.ed-canvas svg{user-select:none;-webkit-user-select:none}
body.paldrag{cursor:grabbing}
.palghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:.55}
.palghost.ok{opacity:.92}
.palghost svg{display:block;overflow:visible}
.palghost.pill{background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:650;padding:5px 10px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ed-canvas.drop{outline:2px dashed var(--accent);outline-offset:-3px}
svg .halo{fill:transparent;stroke:none}
svg .ch{opacity:0;cursor:crosshair;transition:opacity .12s}
svg .chh{fill:transparent;stroke:none}
svg .chd{fill:var(--accent);stroke:var(--card);stroke-width:2}
.ed-canvas svg .nd:hover .ch,.ed-canvas svg .nd.sel .ch{opacity:1}
.ed-canvas svg.linking .ch,.ed-canvas svg.adding .ch{opacity:0}
.ed-canvas svg .nd.tgt .w,.ed-canvas svg .nd.tgt .s{stroke:var(--accent);stroke-width:2.6}
.ed-canvas svg .nd.tgt .f{stroke:var(--accent);stroke-width:4}
svg .ll{fill:transparent;stroke:none;cursor:crosshair}
.ed-canvas svg .ll:hover{fill:var(--accent);fill-opacity:.13}
@media (prefers-reduced-motion:reduce){svg .ch{transition:none}}

.app{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
main{padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));min-width:0}
details summary{cursor:pointer}
.lcard{max-width:680px;margin-left:auto;margin-right:auto}
.lfront{font-size:24px;font-weight:700;text-align:center;padding:26px 8px 10px;overflow-wrap:anywhere}
.lback{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px;text-align:center}
.lback svg{max-width:100%;height:auto}
#imgbox .figure img{max-width:100%;height:auto;background:#fff;border-radius:8px}
textarea#exptext,textarea#imptext{width:100%;box-sizing:border-box;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px}
@media (max-width:820px){main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}nav.side{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="aOpen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="mk" d="M1,1 L11,6 L1,11"/></marker>

const sv=(inner,w=150,h=66)=>`<svg class="sym" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.fs||10}" text-anchor="${o.a||'middle'}" ${o.b?'font-weight="700"':''} ${o.i?'font-style="italic"':''} ${o.u?'text-decoration="underline"':''} ${o.c?`style="fill:var(--accent)"`:''}>${t}</text>`;
const L=(x1,y1,x2,y2,o={})=>`<line class="s ${o.d?'d':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${o.e?`marker-end="url(#${o.e})"`:''} ${o.s?`marker-start="url(#${o.s})"`:''}/>`;
const P=(d,o={})=>`<path class="${o.cls||'s'} ${o.d?'d':''}" d="${d}" ${o.e?`marker-end="url(#${o.e})"`:''}/>`;
const actor=(x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><circle class="w" cx="0" cy="0" r="6"/>${L(0,6,0,22)}${L(-10,12,10,12)}${L(0,22,-9,34)}${L(0,22,9,34)}</g>`;
const state=(x,y,w,h,t,fs=10)=>`<rect class="w" x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/>${T(x+w/2,y+h/2+fs/3,t,{fs})}`;
const action=state;
const dmd=(x,y,r=9)=>`<path class="w" d="M${x},${y-r} L${x+r},${y} L${x},${y+r} L${x-r},${y} Z"/>`;
const start=(x,y,r=7)=>`<circle class="f" cx="${x}" cy="${y}" r="${r}"/>`;
const fin=(x,y)=>`<circle class="w" cx="${x}" cy="${y}" r="9"/><circle class="f" cx="${x}" cy="${y}" r="5"/>`;
const frag=(op,guard,x=12,y=6,w=126,h=54,sep=false,g2='')=>`<rect class="s" x="${x}" y="${y}" width="${w}" height="${h}"/><path class="w" d="M${x},${y} h30 v9 l-5,5 h-25 Z"/>${T(x+13,y+11,op,{fs:9,b:1})}${T(x+36,y+12,guard,{fs:8,a:'start',c:1})}${sep?L(x,y+h/2+4,x+w,y+h/2+4,{d:1})+T(x+5,y+h/2+15,g2,{fs:8,a:'start',c:1}):''}`;
const lifeline=(x,y,t,len=40)=>`<rect class="w" x="${x-26}" y="${y}" width="52" height="16"/>${T(x,y+11,t,{fs:9,u:1})}${L(x,y+16,x,y+16+len,{d:1})}`;

/* ================= ANWENDUNGSFALLDIAGRAMM ================= */
{id:'uc',color:'var(--uc)',de:'Anwendungsfalldiagramm',en:'Use-Case-Diagramm',ru:'Use Case Diagram',
 type:'Verhaltensdiagramm',leit:'Was soll das System leisten – und für wen?',
 short:'Wer arbeitet mit dem System und welche Funktionen bietet es an.',
 theory:`
<p class="lead">Ein <span class="de">Anwendungsfalldiagramm</span> zeigt das <b>funktionale Verhalten</b> eines Systems aus Sicht der externen <span class="de">Akteure</span>: <i>was</i> das System leistet und <i>für wen</i>. Interne Logik und Technik werden nicht dargestellt.</p>
<div class="q-box"><b>Leitfrage:</b> Was soll das System leisten – und für wen? <br><b>Achtung:</b> Das Diagramm zeigt <u>keine</u> zeitliche Reihenfolge, keine Schleifen und keine Bedingungen!</div>
<h3>Wozu es dient (Ziele und Zwecke)</h3>
<ul class="clean">
<li><span class="de">Fachliche Anforderungserhebung</span> – Anforderungen aus Sicht von Auftraggeber und Benutzern erfassen.</li>
<li><span class="de">Systemkontext &amp; Systemgrenze</span> – was gehört zur Entwicklung und wer interagiert von außen.</li>
<li><span class="de">Kommunikationsbasis</span> – verständlich für Auftraggeber, Analysten und Architekten.</li>
<li>Abgrenzung: Detaillierte Schritte werden in <b>Aktivitäts-</b> oder <b>Sequenzdiagrammen</b> beschrieben.</li>
</ul>
<h3>Die wichtigsten Regeln</h3>
<ul class="clean">
<li><b>Akteur</b> = eine <u>Rolle</u>, keine konkrete Person (Kunde, Mitarbeiter, Bank-System, Timer). Primärakteure stehen meist links, Sekundärakteure rechts.</li>
<li>Alle <b>Use Cases</b> liegen innerhalb des Rechtecks <b>Systemgrenze</b>, alle <b>Akteure</b> außerhalb.</li>
<li>Name eines Use Case: <b>Substantiv + Verb im Infinitiv</b>: „Gerät reservieren“, „Konto verwalten“.</li>
<li>Ein Use Case ist eine abgeschlossene, für den Akteur nützliche Aufgabe, nicht „Button klicken“.</li>
</ul>
<h3>«include» vs. «extend» – das Wichtigste für die Prüfung</h3>
<table class="compare">
<tr><th></th><th>«include»</th><th>«extend»</th></tr>
<tr><td>Bedeutung</td><td>verpflichtender Teil: wird <b>immer</b> ausgeführt</td><td>optionale/bedingte Erweiterung: <b>kann</b> ausgeführt werden</td></tr>
<tr><td>Pfeil</td><td>vom <b>Basis</b>-UC → zum eingebundenen UC</td><td>vom <b>erweiternden</b> UC → zum Basis-UC</td></tr>
<tr><td>Linie</td><td colspan="2">gestrichelte Linie mit offener Pfeilspitze + Stereotyp</td></tr>
<tr><td>Beispiel</td><td>„Überweisung tätigen“ → «include» → „PIN/TAN prüfen“</td><td>„Quittung drucken“ → «extend» → „Geld abheben“</td></tr>
<tr><td>Wofür</td><td>gemeinsamen Schritt auslagern (z. B. Anmelden) und wiederverwenden</td><td>Sonderfälle, Zusatzleistungen, Fehlerbehandlung</td></tr>
</table>
<div class="tip">💡 Merkhilfe: <b>include</b> – „ich <u>binde</u> ihn in mich ein“ (Pfeil geht von mir weg). <b>extend</b> – „ich <u>erweitere</u> ihn“ (Pfeil von der Erweiterung zur Basis).</div>
<h3>Condition und Extension Point</h3>
<p>An ein «extend» kann man eine Notiz mit der Bedingung hängen: <code>Condition: {Gerät beschädigt}</code>. Die <span class="de">Erweiterungsstelle (Extension Point)</span> wird im Basis-UC unter einem Strich notiert (<code>extension points: Schaden erfassen</code>) und zeigt, <i>wo</i> erweitert werden kann.</p>
<h3>Generalisierung</h3>
<p>Vererbung zwischen <b>Akteuren</b> (Administrator erbt alle Use Cases vom Benutzer) oder zwischen <b>Use Cases</b> (abstrakt „Zahlung leisten“ → „Kreditkartenzahlung“, „PayPal-Zahlung“). Durchgezogene Linie mit <b>leerem Dreieck zum allgemeinen</b> Element. Ein <span class="de">Abstrakter Use Case</span> wird nicht selbst ausgeführt – ausgeführt wird nur seine konkrete Spezialisierung.</p>`,

 tasks:[
  {t:'TechRent – Anforderungen modellieren',text:`<p>Aus dem Kundengespräch (Herr Müller, TechRent GmbH):</p><ul class="clean"><li>Kunden sollen sich <b>anmelden</b> und verfügbare Geräte <b>suchen</b> können. Gefundene Geräte sollen sie für einen Zeitraum <b>reservieren</b> können.</li><li>Kunden können ihre <b>Reservierungen einsehen</b> und – solange das Gerät noch nicht ausgegeben ist – <b>stornieren</b>.</li><li>Die <b>Ausgabe</b> erfolgt vor Ort durch einen Mitarbeiter, der dabei die <b>Reservierung prüft</b>.</li><li>Die <b>Rückgabe</b> übernimmt ein Mitarbeiter; dabei wird der <b>Gerätezustand geprüft</b>. Ist das Gerät beschädigt, wird es <b>als defekt gekennzeichnet</b>.</li><li>Mitarbeiter können Geräte <b>anlegen</b> und <b>Gerätedaten bearbeiten</b>.</li></ul><p><b>Aufgabe:</b> Zeichne auf Papier ein Anwendungsfalldiagramm (Systemgrenze, Akteure, Use Cases, include/extend mit Condition). Vergleiche danach mit der Lösung.</p>`,sol:`<div class="figure"><img src="${'@@uc_techrent'}" alt="Lösung TechRent"></div><ul class="clean"><li>«include»: „Gerät reservieren“ und „Reservierungen einsehen“ → „Anmelden“; „Gerät ausgeben“ → „Reservierung prüfen“; „Gerät zurücknehmen“ → „Gerätezustand prüfen“ (immer).</li><li>«extend»: „Reservierung stornieren“ → „Reservierungen einsehen“ (Condition {nicht ausgegeben}); „Gerät als defekt kennzeichnen“ → „Gerät zurücknehmen“ (Condition {Gerät beschädigt}).</li></ul>`},
  {t:'Banking-App lesen',text:`<div class="figure"><img src="${'@@uc_banking'}" alt="Banking-App"></div><p>Beantworte mündlich:</p><ol><li>Was passiert immer bei „Anmelden“?</li><li>Was passiert nur manchmal?</li><li>Warum ist „Ausreichende Mittel prüfen“ ausgelagert?</li><li>Was bedeutet das Dreieck unter „Zahlung leisten“?</li></ol>`,sol:`<ol><li>„Passwort überprüfen“ («include» – immer).</li><li>„Anmeldefehler anzeigen“ («extend» – nur im Fehlerfall).</li><li>Das ist ein gemeinsamer Schritt für „Mittel übertragen“ und „Zahlung leisten“ – er wird über «include» wiederverwendet.</li><li>Generalisierung: „Vom Girokonto bezahlen“ und „Vom Sparguthaben bezahlen“ sind Spezialisierungen von (abstrakt) „Zahlung leisten“.</li></ol>`}

/* ================= KLASSENDIAGRAMM ================= */
{id:'cl',color:'var(--cl)',de:'Klassendiagramm',en:'Class Diagram',ru:'Class Diagram',
 type:'Strukturdiagramm',leit:'Wie ist das System statisch aufgebaut?',
 short:'Klassen, Attribute, Methoden und ihre Beziehungen – die statische Struktur.',
 theory:`
<p class="lead">Ein <span class="de">Klassendiagramm</span> beschreibt die <b>statische Struktur</b> eines Systems: welche Klassen es gibt, ihre <span class="de">Attribute</span> und <span class="de">Methoden</span> und wie die Klassen zusammenhängen. Es ist der „Bauplan“ für die Programmierung.</p>
<div class="q-box"><b>Leitfrage:</b> Wie ist das System aufgebaut (Klassen, Attribute, Methoden, Beziehungen)?<br><b>Achtung:</b> Es zeigt nicht die zeitliche Reihenfolge der Methodenaufrufe.</div>
<h3>Klasse = Rechteck mit drei Bereichen</h3>
<ol><li><b>Name</b> (oben, fett)</li><li><b>Attribute</b>: <code>Sichtbarkeit name : Datentyp = Initialwert</code> → <code>- storniert : boolean = false</code></li><li><b>Methoden</b>: <code>Sichtbarkeit name(param : Typ) : Rückgabetyp</code> → <code>+ istVerfuegbar() : boolean</code></li></ol>
<h3>Sichtbarkeiten (Access Modifiers)</h3>
<table><tr><th>Zeichen</th><th>Name</th><th>Zugriff</th></tr>
<tr><td><code>+</code></td><td>public</td><td>von überall</td></tr>
<tr><td><code>-</code></td><td>private</td><td>nur innerhalb der eigenen Klasse (typisch für Attribute → Kapselung)</td></tr>
<tr><td><code>#</code></td><td>protected</td><td>Klasse und ihre Unterklassen</td></tr>
<tr><td><code>~</code></td><td>package</td><td>innerhalb desselben Pakets</td></tr></table>
<p><b>static</b> (Klassenattribut/-methode) → <u>unterstrichen</u>. <b>abstrakt</b> → <i>kursiv</i> oder <code>«abstract»</code>. <b>Interface</b> → <code>«interface»</code>, nur Methodensignaturen.</p>
<h3>Beziehungen</h3>
<table class="compare">
<tr><th>Beziehung</th><th>Darstellung</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td>Assoziation</td><td>durchgezogene Linie (Pfeil = Navigierbarkeit)</td><td>„kennt“</td><td>Kunde – Fahrzeug</td></tr>
<tr><td>Aggregation</td><td>leere Raute ◇ beim Ganzen</td><td>„hat Teile“, das Teil existiert auch allein</td><td>Fuhrpark ◇– Fahrzeug</td></tr>
<tr><td>Komposition</td><td>gefüllte Raute ◆ beim Ganzen</td><td>„besteht fest aus“, das Teil stirbt mit dem Ganzen</td><td>Haus ◆– Raum</td></tr>
<tr><td>Generalisierung</td><td>durchgezogene Linie, leeres Dreieck zur Oberklasse</td><td>„ist ein“ (extends)</td><td>Auto → Fahrzeug</td></tr>
<tr><td>Realisierung</td><td>gestrichelt, leeres Dreieck zum Interface</td><td>„setzt Vorgaben um“ (implements)</td><td>Auto ⇢ «interface» Mietbar</td></tr>
<tr><td>Abhängigkeit</td><td>gestrichelt mit offener Pfeilspitze</td><td>„verwendet“ kurzzeitig</td><td>Rechnung ⇢ Drucker</td></tr>
</table>
<div class="tip">💡 <b>Aggregation vs. Komposition</b> = Frage der Lebensdauer: Lösche ich das Ganze – verschwindet dann auch das Teil? Ja → Komposition (◆). Nein → Aggregation (◇).<br>💡 <b>Generalisierung vs. Realisierung</b>: Ich erbe Struktur und Verhalten (durchgezogen) vs. ich verpflichte mich, die Methoden des Interface umzusetzen (gestrichelt).</div>
<h3>Multiplizitäten</h3>
<table><tr><th>Notation</th><th>Bedeutung</th></tr>
<tr><td><code>1</code></td><td>genau eins (Pflicht)</td></tr>
<tr><td><code>0..1</code></td><td>null oder eins (optional)</td></tr>
<tr><td><code>0..*</code> oder <code>*</code></td><td>beliebig viele</td></tr>
<tr><td><code>1..*</code></td><td>mindestens eins</td></tr>
<tr><td><code>2..5</code></td><td>konkreter Bereich</td></tr></table>
<p>So liest man es: „Ein Kunde erstellt <b>0..*</b> Reservierungen, eine Reservierung gehört zu genau <b>1</b> Kunde.“ Die Zahl steht bei der <u>gegenüberliegenden</u> Klasse.</p>`,

  {n:'Komposition',d:'Gefüllte Raute beim Ganzen. Das Teil stirbt mit dem Ganzen.',s:sv(`<rect class="w" x="4" y="22" width="40" height="20"/>${T(24,35,'Haus',{fs:8})}<rect class="w" x="106" y="22" width="40" height="20"/>${T(126,35,'Raum',{fs:8})}${L(44,32,106,32,{s:'diaF'})}`)},
  {n:'Generalisierung (Vererbung)',d:'„ist ein“. Durchgezogene Linie, leeres Dreieck zur Oberklasse.',s:sv(`<rect class="w" x="55" y="4" width="40" height="18"/>${T(75,16,'Fahrzeug',{fs:7.5})}<rect class="w" x="55" y="44" width="40" height="18"/>${T(75,56,'Auto',{fs:8})}${L(75,44,75,22,{e:'tri'})}`)},
  {n:'Realisierung',d:'„implementiert“. Gestrichelt, leeres Dreieck zum Interface.',s:sv(`<rect class="w" x="50" y="4" width="50" height="18"/>${T(75,16,'«if» Mietbar',{fs:7.5})}<rect class="w" x="55" y="44" width="40" height="18"/>${T(75,56,'Auto',{fs:8})}${L(75,44,75,22,{e:'tri',d:1})}`)},

/* ================= ZUSTANDSDIAGRAMM ================= */
{id:'st',color:'var(--st)',de:'Zustandsdiagramm',en:'State Machine Diagram',ru:'State Machine Diagram',
 type:'Verhaltensdiagramm',leit:'Welche Zustände kann EIN Objekt annehmen und wodurch wechselt es?',
 short:'Lebenszyklus eines Objekts: Zustände und Übergänge durch Ereignisse.',
 theory:`
<p class="lead">Ein <span class="de">Zustandsdiagramm</span> beschreibt das Verhalten <b>eines einzelnen Objekts</b> (oder Systems) über seinen Lebenszyklus: welche <span class="de">Zustände</span> möglich sind, welche <span class="de">Ereignisse</span> Übergänge auslösen und was dabei ausgeführt wird (intra-object behavior).</p>
<div class="q-box"><b>Leitfrage:</b> In welchen Zuständen kann sich ein Objekt befinden und wodurch wechselt es den Zustand?<br><b>Nicht verwechseln:</b> Zusammenspiel mehrerer Objekte im Zeitverlauf → Sequenzdiagramm.</div>
<h3>Elemente</h3>
<ul class="clean">
<li><b>Zustand</b> – Rechteck mit abgerundeten Ecken. Er ist eine <u>stabile Situation</u> über eine gewisse Zeit: „verfügbar“, „fahrbereit“, „in Wartung“ – keine Aktion („Auto starten“ ✗).</li>
<li><b>Startzustand</b> – gefüllter Kreis ●. <b>Endzustand</b> – Kreis mit Punkt ◉ (hat keine ausgehenden Übergänge, ist nicht immer nötig).</li>
<li><b>Transition</b> – Pfeil vom Ausgangs- zum Zielzustand.</li>
</ul>
<h3>Beschriftung eines Übergangs</h3>
<div class="q-box" style="font-size:19px;text-align:center"><code>Ereignis [Guard] / Effekt</code></div>
<p>Beispiel: <code>losfahren [Tankfüllstand &gt; 0] / Fahrtbeginn speichern</code> – das Ereignis „losfahren“ löst den Übergang nur aus, wenn die Bedingung wahr ist; beim Übergang wird der Effekt ausgeführt.</p>
<h3>Interne Aktivitäten</h3>
<table><tr><th>Notation</th><th>Wann</th><th>Beispiel</th></tr>
<tr><td><code>entry / …</code></td><td>beim Betreten des Zustands</td><td>entry / Bordcomputer aktivieren</td></tr>
<tr><td><code>do / …</code></td><td>solange das Objekt im Zustand ist</td><td>do / Geschwindigkeit überwachen</td></tr>
<tr><td><code>exit / …</code></td><td>beim Verlassen</td><td>exit / Fahrtdaten speichern</td></tr></table>
<h3>Ereignisarten</h3>
<table><tr><th>Art</th><th>Beispiel</th></tr>
<tr><td>Call-Ereignis (Aufruf einer Operation)</td><td><code>motorStarten()</code></td></tr>
<tr><td>Signalereignis</td><td><code>WarnsignalEmpfangen</code></td></tr>
<tr><td>Zeitereignis</td><td><code>after(24h)</code>, <code>at(18:00)</code></td></tr>
<tr><td>Änderungsereignis</td><td><code>when(tankfüllstand = 0)</code></td></tr>
<tr><td>Completion Event</td><td>Übergang ohne explizites Ereignis, sobald die Aktivität abgeschlossen ist</td></tr></table>
<h3>Außerdem wichtig</h3>
<ul class="clean">
<li><b>Guards</b> bei demselben Ereignis müssen eindeutig sein: <code>[Tank &gt; 0]</code> / <code>[Tank = 0]</code> oder <code>[else]</code>.</li>
<li><b>Entscheidungsknoten</b> (kleine Raute) – Verzweigung anhand von Guards.</li>
<li><b>Selbsttransition</b>: von einem Zustand in denselben Zustand. Der Zustand wird formal verlassen → exit und entry werden erneut ausgeführt (anders als bei internem Verhalten).</li>
<li>Ein <b>Zusammengesetzter Zustand</b> (Composite State) enthält Unterzustände und einen eigenen inneren Startzustand.</li>
<li>Bezug zum Klassendiagramm: Ein Zustand ist oft der Wert eines Attributs (<code>status</code>), ein Übergang oft der Aufruf einer Operation.</li>
</ul>`,

  {t:'TechRent – Zustände eines Geräts',text:`<p>Herr Müller: „Neues Gerät ist nach Freigabe <b>verfügbar</b>. Reserviert ein Kunde es, gilt es als <b>reserviert</b>. Wird es ausgegeben, ist es <b>ausgeliehen</b>. Ordnungsgemäß zurückgegeben → wieder verfügbar. Bei Schaden → <b>defekt</b>, dann zur Reparatur → <b>in Wartung</b>. Erst nach abgeschlossener Reparatur und Prüfung wieder verfügbar.“ (Reservierung kann auch storniert werden.)</p><p><b>Aufgabe:</b> Zustandsdiagramm für ein Gerät.</p>`,sol:`@@SVG:stGeraet`},
  {t:'Roboter (aus 05_LAB)',text:`<ul class="clean"><li>Nach dem Einschalten → Initialisierung.</li><li>Danach Self-Check: OK → Stand-By, sonst → Error (bis Abschalten).</li><li>Stand-By: Auftrag erhalten → In Arbeit; fertig → zurück Stand-By.</li><li>Fehler während Auftrag → Error.</li><li>Aus Stand-By und Error: abschalten → Ende.</li></ul>`,sol:`<table><tr><th>Von</th><th>Transition</th><th>Nach</th></tr><tr><td>●</td><td>einschalten</td><td>Initialisierung</td></tr><tr><td>Initialisierung</td><td>Self-Check [OK]</td><td>Stand-By</td></tr><tr><td>Initialisierung</td><td>Self-Check [nicht OK] / [else]</td><td>Error</td></tr><tr><td>Stand-By</td><td>Auftrag erhalten</td><td>In Arbeit</td></tr><tr><td>In Arbeit</td><td>Auftrag erledigt</td><td>Stand-By</td></tr><tr><td>In Arbeit</td><td>Fehler aufgetreten / Abarbeitung anhalten</td><td>Error</td></tr><tr><td>Stand-By</td><td>abschalten</td><td>◉</td></tr><tr><td>Error</td><td>abschalten</td><td>◉</td></tr></table><p>Statt zweier Übergänge aus Initialisierung kann man einen Entscheidungsknoten (Raute) mit den Guards [OK] / [else] setzen.</p>`},
  {t:'Datei (aus 05_LAB)',text:`<p>„Nach dem Anlegen muss eine Datei zum Lesen bzw. Schreiben geöffnet werden. Soll geschrieben werden → Status <b>entsperrt</b>. Beim Lesen gilt sie nur als <b>geöffnet</b>. Lesen/Schreiben kann wiederholt werden, bis sie geschlossen wird; dabei bleibt der Status bestehen. Eine geschlossene Datei kann gelöscht werden.“</p>`,sol:`<table><tr><th>Von</th><th>Transition</th><th>Nach</th></tr><tr><td>●</td><td>anlegen</td><td>angelegt / geschlossen</td></tr><tr><td>geschlossen</td><td>öffnen [lesen]</td><td>geöffnet</td></tr><tr><td>geschlossen</td><td>öffnen [schreiben]</td><td>entsperrt</td></tr><tr><td>geöffnet</td><td>lesen (Selbsttransition)</td><td>geöffnet</td></tr><tr><td>entsperrt</td><td>schreiben (Selbsttransition)</td><td>entsperrt</td></tr><tr><td>geöffnet / entsperrt</td><td>schließen</td><td>geschlossen</td></tr><tr><td>geschlossen</td><td>löschen</td><td>◉</td></tr></table><p>Der Kernpunkt: Erneutes Lesen/Schreiben ist eine <b>Selbsttransition</b> (der Status ändert sich nicht).</p>`}

/* ================= AKTIVITÄTSDIAGRAMM ================= */
{id:'ac',color:'var(--ac)',de:'Aktivitätsdiagramm',en:'Activity Diagram',ru:'Activity Diagram',
 type:'Verhaltensdiagramm',leit:'Wie läuft ein Prozess Schritt für Schritt ab?',
 short:'Ablauf Schritt für Schritt: Aktionen, Entscheidungen, Schleifen, Parallelität, Swimlanes.',
 theory:`
<p class="lead">Ein <span class="de">Aktivitätsdiagramm</span> beschreibt einen <b>Ablauf Schritt für Schritt</b>: welche <span class="de">Aktionen</span> ausgeführt werden, in welcher Reihenfolge, wo verzweigt, zusammengeführt, wiederholt oder parallel gearbeitet wird. Geeignet für Use Cases, Programmlogik, Services und Geschäftsprozesse.</p>
<div class="q-box"><b>Leitfrage:</b> Wie läuft ein Prozess ab? (Wer macht was – mit Swimlanes.)</div>
<h3>Knoten und Kanten</h3>
<ul class="clean">
<li><b>Aktion</b> – abgerundetes Rechteck, Name <b>Verb + Objekt</b>: „Verfügbarkeit prüfen“.</li>
<li><b>Initialknoten</b> ● – Start. <b>Aktivitätsendknoten</b> ◉ – beendet die <u>gesamte</u> Aktivität (auch alle parallelen Pfade). <b>Ablaufendknoten</b> ⊗ – beendet <u>nur den eigenen Pfad</u>.</li>
<li><b>Kontrollfluss</b> – Pfeil, Reihenfolge der Ausführung.</li>
</ul>
<h3>Decision/Merge vs. Fork/Join – der wichtigste Unterschied</h3>
<table class="compare">
<tr><th></th><th>Art</th><th>Wirkung</th></tr>
<tr><td>Decision</td><td>Raute, 1 Eingang, n Ausgänge mit [Guards]</td><td>wählt <b>genau einen</b> alternativen Pfad</td></tr>
<tr><td>Merge</td><td>Raute, n Eingänge, 1 Ausgang</td><td>führt Alternativen zusammen, <b>wartet nicht</b></td></tr>
<tr><td>Fork</td><td>schwarzer Balken, 1 Eingang, n Ausgänge</td><td>startet die Pfade <b>gleichzeitig</b></td></tr>
<tr><td>Join</td><td>schwarzer Balken, n Eingänge, 1 Ausgang</td><td><b>wartet auf alle</b> eingehenden Pfade</td></tr>
</table>
<div class="tip">💡 Raute = „oder“ (Alternativen). Balken = „und“ (Parallelität).</div>
<h3>Token-Konzept</h3>
<p>Stell dir eine unsichtbare Marke (<span class="de">Token</span>) vor, die durch das Diagramm läuft. Eine Aktion wird ausgeführt, sobald das Token ankommt; danach wird es weitergegeben. Ein Fork teilt das Token in mehrere, ein Join wartet auf alle.</p>
<h3>Schleife</h3>
<p>Schleife = Rückkante zu einem früheren Merge: „Solange Eingaben ungültig → Angaben korrigieren → erneut absenden“.</p>
<h3>Objektfluss</h3>
<p><span class="de">Objektknoten</span> (normales Rechteck, z. B. „Reservierung“) zeigen Daten zwischen Aktionen. <span class="de">Pins</span> sind kleine Quadrate an einer Aktion (Eingang/Ausgang). <span class="de">Central Buffer</span> = temporäre Daten, <span class="de">Data Store</span> = dauerhafte Daten (DB).</p>
<h3>Partitionen (Swimlanes)</h3>
<p>Sie teilen Aktionen nach Verantwortung auf: Frontend, Backend/API, Datenbank, externer Dienst. Sie ändern den Ablauf nicht, sondern beantworten nur die Frage „Wer führt aus?“. Verwende nicht zu viele Bahnen.</p>
<h3>Abgrenzung</h3>
<p>Aktivität: „Wie läuft der Prozess ab?“ · Zustand: „Welche Zustände hat ein Objekt?“ · Sequenz: „Wer kommuniziert wann mit wem?“</p>`,

/* ================= SEQUENZDIAGRAMM ================= */
{id:'sq',color:'var(--sq)',de:'Sequenzdiagramm',en:'Sequence Diagram',ru:'Sequence Diagram',
 type:'Verhaltensdiagramm (Interaktion)',leit:'Wer kommuniziert wann mit wem?',
 short:'Nachrichten zwischen Beteiligten im Zeitverlauf: von oben nach unten.',
 theory:`
<p class="lead">Ein <span class="de">Sequenzdiagramm</span> zeigt die <b>Interaktion im Zeitverlauf</b>: welche Beteiligten (<span class="de">Interaktionspartner</span>) <span class="de">Nachrichten</span> austauschen und in welcher Reihenfolge – vom Aufruf bis zur Antwort.</p>
<div class="q-box"><b>Leitfrage:</b> Wer kommuniziert wann mit wem? Die Zeit läuft <b>von oben nach unten</b>; die horizontale Position hat keine Bedeutung.</div>
<h3>Grundlagen</h3>
<ul class="clean">
<li><b>Lebenslinie</b>: Kopf (Rechteck <code>:Backend</code>, Name unterstrichen) + gestrichelte Linie nach unten. Auch ein Akteur hat eine Lebenslinie.</li>
<li><b>Ausführungsspezifikation (Aktivierung)</b>: schmaler Balken auf der Linie – der Beteiligte arbeitet gerade.</li>
<li>Der Pfeil zeigt auf den <b>Empfänger</b>. Eine Nachricht ist meist der Aufruf einer Methode des Empfängers (Bezug zum Klassendiagramm!).</li>
<li>Rahmen der gesamten Interaktion: <code>sd Name</code> im Fünfeck links oben.</li>
</ul>
<h3>Nachrichtenarten</h3>
<table class="compare">
<tr><th>Nachricht</th><th>Art</th><th>Bedeutung</th></tr>
<tr><td>synchron</td><td>durchgezogene Linie, <b>gefüllte</b> Pfeilspitze ▶</td><td>der Sender <b>wartet</b> auf das Ende (Methodenaufruf)</td></tr>
<tr><td>asynchron</td><td>durchgezogene Linie, <b>offene</b> Pfeilspitze &gt;</td><td>der Sender <b>wartet nicht</b> (Event, Queue, Mail-Dienst)</td></tr>
<tr><td>Antwort (Reply)</td><td><b>gestrichelt</b>, offene Pfeilspitze</td><td>Rückgabewert: <code>verfuegbar: Boolean</code></td></tr>
<tr><td>Selbstaufruf</td><td>Pfeil auf die eigene Linie</td><td>interner Aufruf: <code>angabenPruefen(...)</code></td></tr>
<tr><td>create</td><td>Pfeil zum Kopf des neuen Objekts, «create»</td><td>Die Lebenslinie beginnt im Moment der Erzeugung</td></tr>
<tr><td>Destruction</td><td>X am Ende der Linie</td><td>das Objekt wird innerhalb der Interaktion zerstört</td></tr>
</table>
<h3>Kombinierte Fragmente</h3>
<table class="compare">
<tr><th>Operator</th><th>Bedeutung</th><th>Entsprechung im Code</th></tr>
<tr><td><code>alt</code></td><td>Alternativen mit Guards, eine gestrichelte Linie trennt die Operanden: [verfügbar] / [else]</td><td>if / else</td></tr>
<tr><td><code>opt</code></td><td>wird nur ausgeführt, wenn der [Guard] wahr ist, ohne zweiten Zweig</td><td>if ohne else</td></tr>
<tr><td><code>loop</code></td><td>Wiederholung: <code>loop(1,3)</code>, [für jedes Gerät]</td><td>for / while</td></tr>
<tr><td><code>par</code></td><td>die Operanden laufen parallel, ihre Reihenfolge untereinander ist nicht festgelegt</td><td>Threads</td></tr>
<tr><td><code>break</code></td><td>Abbruch</td><td>break</td></tr>
</table>
<div class="tip">💡 Zwei Pfeile auf gleicher Höhe ≠ gleichzeitig. Parallelität gibt es nur über <code>par</code>.</div>
<h3>Bezug zum Klassendiagramm</h3>
<p>Die Nachricht <code>reservieren(geraetId, von, bis)</code> an <code>:Backend</code> bedeutet: Backend muss diese Operation besitzen. Gibt es im Sequenzdiagramm eine Operation, die im Klassendiagramm fehlt, ergänze die Klassen.</p>`,

function startQuiz(el,qs,key,color,limit){
  qs=shuffle(qs);if(limit)qs=qs.slice(0,limit);
  let i=0,score=0,wrong=[];
  const show=()=>{
    if(i>=qs.length){
      const pct=score/qs.length;
      if(key){store.best[key]=Math.max(store.best[key]||0,pct);save();renderNav();}
      el.innerHTML=`<div class="card result"><div class="big" style="color:${pct>=.8?'var(--ok)':pct>=.5?'var(--warn)':'var(--bad)'}">${score} / ${qs.length}</div><p>${pct>=.8?'Sehr gut! Prüfungsniveau 👍':pct>=.5?'Nicht schlecht, wiederhole die Themen mit Fehlern.':'Lies die Theorie noch einmal und versuche es erneut.'}</p>${wrong.length?`<div style="text-align:left"><h3>Fehler:</h3><ul class="clean">${wrong.map(w=>`<li>${w}</li>`).join('')}</ul></div>`:''}<button class="btn primary" id="again">Noch einmal</button></div>`;
      el.querySelector('#again').onclick=()=>startQuiz(el,qs,key,color,limit);return;
    }
    const q=qs[i];
    const opts=shuffle(q.o.map((t,k)=>({t,ok:k===q.a})));
    el.innerHTML=`<div class="card" style="--c:${color}"><div class="qhead"><span>Frage ${i+1} von ${qs.length}${q.tag?' · '+q.tag:''}</span><span>✓ ${score}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>${q.svg?`<div class="qsvg">${q.svg}</div>`:''}<div class="qtext">${q.q}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div><div id="fb"></div></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k];
      el.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add('ok');});
      if(typeof qStat==='function')qStat(q,o.ok);
      if(o.ok)score++;else{b.classList.add('bad');wrong.push(`${q.q.replace(/<[^>]+>/g,'')} → <b>${q.o[q.a]}</b>`);}
      el.querySelector('#fb').innerHTML=`<div class="expl">${o.ok?'✅ Richtig. ':'❌ Falsch. '}${q.e||''}</div><p><button class="btn primary" id="nx">${i+1<qs.length?'Weiter →':'Ergebnis'}</button></p>`;
      el.querySelector('#nx').onclick=()=>{i++;show();};
      el.querySelector('#nx').focus();
    });
  };
  show();
}
function symbolQuestions(){
  const all=[];MODULES.forEach(m=>m.notation.forEach(n=>all.push({...n,m})));
  return all.map(n=>{
    const same=all.filter(x=>x!==n&&x.n!==n.n);
    const pref=shuffle(same.filter(x=>x.m===n.m)).concat(shuffle(same.filter(x=>x.m!==n.m)));
    const distract=[...new Set(pref.map(x=>x.n))].slice(0,3);
    return {svg:n.s,q:'Wie heißt dieses Element?',o:[n.n,...distract],a:0,e:`<b>${n.n}</b> (${n.m.de}): ${n.d}`,tag:n.m.de};
  });
}
function whichQuestions(){
  return WHICH.map(([s,id])=>{const m=MODULES.find(x=>x.id===id);return{q:s,o:[m.de,...MODULES.filter(x=>x!==m).map(x=>x.de)].slice(0,5),a:0,e:`<b>${m.de}</b>: ${m.leit}`};});

 return F;}
function reachBackToActor(doc,g,u){const seen=new Set([u.id]),q=[u.id];while(q.length){const id=q.shift();for(const e of doc.edges){let o=null;

function rulesCL(doc){const g=G(doc),F=[],add=(lv,t,...ids)=>F.push({lv,t,ids});const cls=g.K('class');

function labelSyntax(l,add,id){if(!l)return;const o=(l.match(/\[/g)||[]).length,c=(l.match(/\]/g)||[]).length;if(o!==c)add('err',`In der Beschriftung „${l}“ sind die eckigen Klammern des Guards nicht geschlossen.`,id);if(/[{}]/.test(l))add('tip',`„${l}“: Ein Guard steht in eckigen Klammern [ ], nicht in geschweiften.`,id);}
function rulesST(doc){const g=G(doc),F=[],add=(lv,t,...ids)=>F.push({lv,t,ids});const ini=g.K('initial'),fin=g.K('final'),sts=g.K('state'),ch=g.K('choice');

/* ================= ENGINE 2: Musterdiagramme, statische Darstellung ================= */
const GRIDS={uc:[200,86,150,70],cl:[290,200,150,40],st:[230,125,150,70]};
/* Erzeugt aus der Spezifikation einer Aufgabe ein zeichenbares Dokument. Graph-Diagramme brauchen spec.pos = {key:[Spalte,Zeile]}; das Sequenzdiagramm braucht nichts. */
function docFromSpec(t,drop){const sp=t.spec,type=t.type;drop=drop||[];
 if(t.doc){const d=JSON.parse(JSON.stringify(t.doc));if(drop.length){const rm=drop.map(k=>d.ids[k]);d.nodes=d.nodes.filter(n=>!rm.includes(n.id));d.edges=d.edges.filter(e=>!rm.includes(e.from)&&!rm.includes(e.to));}return d;}
 if(type==='sq'){const d={type:'sq',parts:[],rows:[],n:1},id={};
  sp.parts.forEach(p=>{const o={id:'p'+d.n++,name:p.name,actor:!!p.actor};id[p.k]=o.id;d.parts.push(o);});
  (sp.sol||sp.msgs.map((_,i)=>i)).forEach((x,ix)=>{const rid='r'+d.n++;
   if(typeof x==='number'){if(drop.includes(x))return;const m=sp.msgs[x],ty=[].concat(m.type)[0];d.rows.push({id:rid,kind:'msg',from:id[m.a],to:id[[].concat(m.b)[0]],mtype:ty,text:m.sol!=null?m.sol:(/^«/.test(m.name)?'':m.name),k:x});}
   else if(x==='end')d.rows.push({id:rid,kind:'end'});else if(x[0]==='else')d.rows.push({id:rid,kind:'else',guard:x[1]||''});else d.rows.push({id:rid,kind:'frag',op:x[0],guard:x[1]||''});});
  d.ids=id;return d;}
 if(!sp.pos)return null;
 const [dx,dy,ox,oy]=GRIDS[type]||GRIDS.st;const d={type,nodes:[],edges:[],n:1},id={};
 const at=(n,k)=>{const p=sp.pos[k];const [w,h]=size(n);n.x=Math.round(ox+p[0]*dx-w/2);n.y=Math.round(oy+p[1]*dy-h/2);};
 let sys=null;
 sp.nodes.forEach(s=>{if(drop.includes(s.k))return;const k=[].concat(s.kind)[0];const n={id:'n'+d.n++,kind:k,x:0,y:0,text:s.name};
  if(k==='class'){n.attrs=s.as!=null?s.as:(s.attrs||[]).map(a=>'- '+[].concat(a)[0]+' : String').join('\n');n.methods=s.ms!=null?s.ms:(s.meth||[]).map(a=>'+ '+[].concat(a)[0]+'() : void').join('\n');if(s.st)n.stereo=s.st;}
  id[s.k]=n.id;d.nodes.push(n);if(k==='system'){sys=n;return;}if(sp.pos[s.k])at(n,s.k);});
 (sp.notes||[]).forEach(([k,txt])=>{if(!sp.pos[k])return;const n={id:'n'+d.n++,kind:'note',x:0,y:0,text:txt};at(n,k);d.nodes.push(n);});
 if(sys){let x1=1e9,y1=1e9,x2=0,y2=0;d.nodes.filter(n=>n.kind==='usecase'||n.kind==='note').forEach(n=>{const b=box(n);x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w);y2=Math.max(y2,b.y+b.h);});
  if(x2){sys.x=x1-30;sys.y=y1-50;sys.w=x2-x1+60;sys.h=y2-y1+80;}}
 const special={};const end=k=>{if(k[0]!=='@')return id[k];if(!special[k]){const n={id:'n'+d.n++,kind:k.slice(1),x:0,y:0,text:''};if(sp.pos[k])at(n,k);d.nodes.push(n);special[k]=n.id;}return special[k];};
 (sp.edges||[]).forEach(e=>{if(drop.includes(e.a)||drop.includes(e.b))return;const k=[].concat(e.kind)[0];const a=end(e.a),b=end(e.b);if(!a||!b)return;
  d.edges.push({id:'e'+d.n++,kind:k,from:a,to:b,label:(k==='trans'||k==='flow')?(e.txt||''):'',m1:e.ma?[].concat(e.ma)[0]:'',m2:e.mb?[].concat(e.mb)[0]:''});});
 const minY=Math.min(...d.nodes.map(n=>n.y)),minX=Math.min(...d.nodes.map(n=>n.x-(n.kind==='actor'?24:0)));
 const top=d.edges.some(e=>e.from===e.to)?74:16,left=type==='st'?30:16;const sx=minX<left?left-minX:0,sy=minY<top?top-minY:0;if(sx||sy)d.nodes.forEach(n=>{n.x+=sx;n.y+=sy;});
 d.ids=Object.assign({},id,special);return d;}
const canRender=t=>!!(t&&(t.doc||(t.spec&&(t.type==='sq'||t.spec.pos))));

/* Aktivitätsaufgaben werden als Musterzeichnung geschrieben; die Vergleichsspezifikation wird daraus abgeleitet.
   ref = {lanes:[[key,name,kw,not?]], n:[[key,kind,col,row,text,kw?,opts?]], e:[[from,to,label?,lab?]]} */
function acDoc(ref){const LW=ref.lw||250,RH=ref.rh||78;const d={type:'ac',nodes:[],edges:[],n:1},id={};const lanes=ref.lanes||[];
 let maxRow=0;ref.n.forEach(x=>{maxRow=Math.max(maxRow,x[3]);});
 lanes.forEach((l,i)=>{const n={id:'n'+d.n++,kind:'lane',x:16+i*LW,y:16,w:LW,h:(maxRow+1)*RH+70,text:l[1]};id[l[0]]=n.id;d.nodes.push(n);});
 ref.n.forEach(([k,kind,c,r,text,kw,o])=>{const n={id:'n'+d.n++,kind,x:0,y:0,text:text||''};if(o&&o.vert)n.vert=true;if(o&&o.len)n.len=o.len;const [w,h]=size(n);
  n.x=Math.round(16+(lanes.length?LW*(c+0.5):110+c*220)-w/2);n.y=Math.round(16+(lanes.length?52:20)+r*RH+RH/2-h/2);id[k]=n.id;d.nodes.push(n);});
 ref.e.forEach(([a,b,label])=>{d.edges.push({id:'e'+d.n++,kind:'flow',from:id[a],to:id[b],label:label||''});});
 d.ids=id;return d;}
function acSpec(ref,doc){const lanes=ref.lanes||[];const nodes=[],edges=[];const byK={};ref.n.forEach(x=>byK[x[0]]=x);
 lanes.forEach(l=>nodes.push({k:l[0],kind:'lane',name:l[1],kw:l[2],not:l[3]}));
 ref.n.forEach(([k,kind,c,r,text,kw,o])=>{if(kind!=='action')return;const s={k,kind:'action',name:text.replace(/\n/g,' '),kw:kw||[text.split(/\s+/)[0].toLowerCase().slice(0,6)]};if(o&&o.not)s.not=o.not;if(o&&o.opt)s.opt=true;
  if(lanes.length&&!(o&&o.nolane))s.lane=lanes[Math.max(0,Math.min(lanes.length-1,Math.floor(c)))][0];nodes.push(s);});
 const out=k=>ref.e.filter(e=>e[0]===k);const isCtl=k=>['diamond','bar'].includes(byK[k][1]);
 ref.n.forEach(([k,kind])=>{if(kind!=='action'&&kind!=='initial')return;
  (function go(cur,labs,lab,seen){out(cur).forEach(e=>{const b=e[1],kb=byK[b][1];const l2=e[2]?labs.concat(e[2]):labs,lb2=e[3]?lab.concat(e[3]):lab;
    if(kb==='action'||kb==='final'||kb==='flowfinal'){const o={kind:'flow',a:kind==='initial'?'@initial':k,b:kb==='action'?b:'@final'};if(lb2.length)o.lab=lb2;if(l2.length)o.txt=l2.join(' ');
     if(!edges.some(x=>x.a===o.a&&x.b===o.b))edges.push(o);}
    else if(isCtl(b)&&!seen.includes(b))go(b,l2,lb2,seen.concat(b));});})(k,[],[],[]);});
 const g=G(doc),R=acRoles(doc,g),need={};if(R.dec.length)need.decision=R.dec.length;if(R.mer.length)need.merge=R.mer.length;if(R.fork.length)need.fork=R.fork.length;if(R.join.length)need.join=R.join.length;
 return {nodes,edges,need,note:ref.note};}

/* Statisches SVG eines beliebigen Dokuments (Lösungen, Leseaufgaben, Fehlersuchaufgaben). */
function svgOf(doc,o){o=o||{};const keep=[Pz.sel,Pz.find,Pz.mode];Pz.sel=null;Pz.find=o.hl||null;Pz.mode={t:'select'};let inner,w,h;
 try{if(doc.type==='sq'){const r=drawSQ(doc);inner=r.svg;w=r.w;h=r.h;}
  else{let mx=0,my=0;doc.nodes.forEach(n=>{const b=box(n);mx=Math.max(mx,b.x+b.w+(n.kind==='actor'?26:0));my=Math.max(my,b.y+b.h+(n.kind==='actor'?24:0));});w=mx+24;h=my+24;
   inner=doc.nodes.filter(n=>CONT(n.kind)).map(drawNode).join('')+doc.edges.map(e=>drawEdge(e,doc)).join('')+doc.nodes.filter(n=>!CONT(n.kind)).map(drawNode).join('');}}
 finally{Pz.sel=keep[0];Pz.find=keep[1];Pz.mode=keep[2];}
 w=Math.round(w);h=Math.round(h);return `<svg class="sym${o.pick?' pick':''}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="min-width:${Math.min(w,700)}px">${inner}</svg>`;}
const figOf=(doc,o)=>`<div class="bigsvg dg">${svgOf(doc,o)}</div>`;

/* abgeleitete Aufgaben vorbereiten */
function prepTasks(list){list.forEach(t=>{if(t.ref&&!t.spec){t.doc=acDoc(t.ref);const ids=t.doc.ids;delete t.doc.ids;t.spec=acSpec(t.ref,t.doc);t.doc.ids=ids;}});}

 text:`<p>Ein Objekt <code>:Shop</code> ruft <code>abschliessen(b)</code> an einem Objekt <code>:Bestellverwaltung</code> auf. Stellen Sie den Ablauf der Methode als Sequenzdiagramm dar.</p>`+CODE(`public class Bestellverwaltung {
    private Lager lager;
    private Mailer mailer;

    public Rechnung abschliessen(Bestellung b) {
        Rechnung r = null;
        boolean ok = lager.reservieren(b);
        if (ok) {
            r = new Rechnung(b);
            double summe = r.berechneSumme();
            mailer.sendeBestaetigung(b);   // asynchron: es wird nicht gewartet
        }
        return r;
    }
}`),

<div class="card"><h3 style="margin-top:0">1. Akteure im Detail</h3>
<p>Ein Akteur ist eine <b>Rolle</b>, die jemand oder etwas gegenüber dem System einnimmt. Er steht immer <b>außerhalb</b> des Systems.</p>
<table><tr><th>Art</th><th>Beispiel</th><th>Woran man ihn im Text erkennt</th></tr>
<tr><td>Mensch in einer Rolle</td><td>Kunde, Mitarbeiter, Administrator</td><td>„Kunden können …“, „Der Mitarbeiter soll …“</td></tr>
<tr><td>Externes System (Fremdsystem)</td><td>Zahlungsdienst, Bank, E-Mail-System, ERP</td><td>„externes System“, „Schnittstelle zu …“, „wird von … geliefert“</td></tr>
<tr><td>Zeit (Timer)</td><td>Zeit, Scheduler</td><td>„jede Nacht“, „monatlich automatisch“</td></tr>
<tr><td>Gerät</td><td>Sensor, Kartenleser</td><td>„der Sensor meldet …“</td></tr></table>
<ul class="clean"><li>Der <b>Primärakteur</b> löst den Use Case aus und erhält das Ergebnis (meist links). Der <b>Sekundärakteur</b> wird vom System zur Ausführung benötigt (meist rechts).</li>
<li>Eine Person kann mehrere Rollen einnehmen: Zeichne Rollen, keine Personen.</li>
<li>Die eigene Datenbank des Systems ist <b>kein</b> Akteur: Sie ist Teil des Systems. Akteur ist nur, was außerhalb der Systemgrenze liegt.</li></ul></div>

<div class="card"><h3 style="margin-top:0">2. Wie man Use Cases findet</h3>
<p>Suche im Text nach <b>Verben</b> bei den Rollen: „Kunden können Geräte <u>suchen</u>, <u>reservieren</u> …“. Prüfe jeden Kandidaten mit drei Fragen:</p>
<ol><li>Ist es eine <b>abgeschlossene Handlung</b> mit einem Ergebnis, das dem Akteur nützt?</li><li>Wird er <b>von einem Akteur ausgelöst</b> (oder von einem anderen Use Case über «include»/«extend» benötigt)?</li><li>Geht es darum, <b>was</b> das System tut, nicht <b>wie</b>? („Button klicken“, „Passwort eintippen“ sind Schritte, keine Use Cases.)</li></ol>
<div class="tip">Name: <b>Substantiv + Verb im Infinitiv</b>: „Gerät reservieren“, „Rechnung erstellen“. Mehrere Operationen auf demselben Objekt (anlegen, ändern, löschen) kann man zusammenfassen: „Gerätedaten verwalten“.</div></div>

<div class="card"><h3 style="margin-top:0">3. Signalwörter: vom Text zur Beziehung</h3>
<table><tr><th>Im Text steht</th><th>Im Diagramm</th></tr>
<tr><td>„kann“, „soll … können“, „hat die Möglichkeit“</td><td>Assoziation Akteur — Use Case</td></tr>
<tr><td>„immer“, „jedes Mal“, „dabei wird stets“, „muss vorher“, „nur angemeldet möglich“, „setzt voraus“</td><td><b>«include»</b> (vom Basis-UC zum eingebundenen)</td></tr>
<tr><td>„falls“, „wenn“, „bei Bedarf“, „optional“, „kann zusätzlich“, „im Fehlerfall“, „auf Wunsch“</td><td><b>«extend»</b> (von der Erweiterung zum Basis-UC) + Condition</td></tr>
<tr><td>„kann alles, was … kann, und zusätzlich“, „ist ein spezieller …“</td><td>Generalisierung zwischen Akteuren</td></tr>
<tr><td>„entweder per … oder per …“, „Arten von …“</td><td>Generalisierung zwischen Use Cases</td></tr>
<tr><td>„externes System“, „Dienstleister“, „über die Schnittstelle“</td><td>System als Akteur, rechts</td></tr></table></div>

<div class="card"><h3 style="margin-top:0">4. «include», «extend», Generalisierung: so verwechselst du sie nicht</h3>
<table><tr><th></th><th>«include»</th><th>«extend»</th><th>Generalisierung (UC)</th></tr>
<tr><td>Wann ausgeführt</td><td>immer</td><td>nur unter einer Bedingung</td><td>eine der Spezialisierungen statt des allgemeinen UC</td></tr>
<tr><td>Basis-UC ohne den zweiten</td><td><b>unvollständig</b></td><td>vollständig und eigenständig</td><td>oft abstrakt</td></tr>
<tr><td>Pfeilrichtung</td><td>zum eingebundenen UC</td><td>zum Basis-UC</td><td>zum allgemeinen UC</td></tr>
<tr><td>Linie</td><td>gestrichelt, offene Pfeilspitze</td><td>gestrichelt, offene Pfeilspitze</td><td>durchgezogen, leeres Dreieck</td></tr></table>
<div class="tip">Richtungsregel: Der Abhängigkeitspfeil geht von dem aus, <b>der den anderen kennt</b>. Der Basis-UC kennt den eingebundenen («include» vom Basis-UC aus). Die Erweiterung kennt den Basis-UC, der Basis-UC die Erweiterung aber nicht («extend» von der Erweiterung aus).</div>
<p>Häufiger Fehler: «include» wird benutzt, um die <b>Reihenfolge</b> von Schritten zu zeigen. Das ist falsch: «include» bedeutet „ist verpflichtender Bestandteil“, nicht „wird danach ausgeführt“.</p></div>

<div class="card"><h3 style="margin-top:0">5. Anwendungsfallbeschreibung (Texttabelle)</h3>
<p>Zum Diagramm wird in Klassenarbeiten oft verlangt, einen Use Case als Tabelle zu beschreiben. Die Felder solltest du auswendig kennen:</p>
<table><tr><th>Feld</th><th>Beispiel „Gerät reservieren“</th></tr>
<tr><td>Name</td><td>Gerät reservieren</td></tr>
<tr><td>Kurzbeschreibung</td><td>Ein Kunde reserviert ein verfügbares Gerät für einen Zeitraum.</td></tr>
<tr><td>Akteure</td><td>Kunde</td></tr>
<tr><td>Auslöser</td><td>Kunde klickt bei einem Gerät auf „Reservieren“.</td></tr>
<tr><td>Vorbedingung</td><td>Kunde ist angemeldet; Gerät ist verfügbar.</td></tr>
<tr><td>Standardablauf</td><td>1. Kunde wählt Zeitraum. 2. System prüft Verfügbarkeit. 3. System legt Reservierung an. 4. System zeigt Bestätigung.</td></tr>
<tr><td>Alternativablauf</td><td>2a. Gerät nicht verfügbar: System zeigt Hinweis, Kunde wählt anderen Zeitraum.</td></tr>
<tr><td>Nachbedingung</td><td>Reservierung ist gespeichert; Gerät hat den Status „reserviert“.</td></tr></table>
<p>Genau hier, nicht im Diagramm, stehen die Reihenfolge der Schritte und die Ausnahmen.</p></div>

<div class="card"><h3 style="margin-top:0">6. Was das Diagramm nicht zeigt</h3>
<ul class="clean"><li>Reihenfolge und Zeitpunkt der Ausführung (dafür Aktivitäts- oder Sequenzdiagramm);</li><li>Bedingungen und Schleifen (außer der Condition bei «extend»);</li><li>den inneren Aufbau: Klassen, Datenbanken, Oberfläche;</li><li>wie oft ein Use Case ausgeführt wird.</li></ul></div>`,
exam:`
<div class="card"><h3 style="margin-top:0">So wird gefragt</h3>
<ul class="clean"><li><b>„Erstellen Sie ein Anwendungsfalldiagramm für …“</b> Ein Text mit Anforderungen, aus dem Akteure, Use Cases und Beziehungen herauszuarbeiten sind. Der häufigste Typ.</li>
<li><b>„Ergänzen Sie das Diagramm um …“</b> Ein fertiges Diagramm und eine neue Anforderung („Zusätzlich soll der Kunde …“).</li>
<li><b>„Erläutern Sie den Unterschied zwischen «include» und «extend»“</b> Theorie mit Beispiel.</li>
<li><b>„Beschreiben Sie den Anwendungsfall … tabellarisch“</b> Anwendungsfallbeschreibung.</li>
<li><b>„Welche Fehler enthält das Diagramm?“</b> Akteur innerhalb des Systems, Linie zwischen Use Cases, falsche Pfeilrichtung.</li>
<li><b>„Welche Aussagen lassen sich aus dem Diagramm ableiten?“</b> Diagramm lesen.</li></ul></div>
<div class="card"><h3 style="margin-top:0">Lösungsplan in 6 Schritten</h3>
<ol><li>Markiere im Text die <b>Rollen</b> (wer?) in einer Farbe und die <b>Verben</b> (was tut er?) in einer anderen.</li>
<li>Zeichne die Systemgrenze und beschrifte das System.</li>
<li>Setze die Akteure nach außen: Menschen links, externe Systeme rechts.</li>
<li>Trage die Use Cases innen ein und verbinde sie mit den Akteuren durch einfache Linien.</li>
<li>Geh die Signalwörter durch: „immer“ ergibt «include», „falls / bei Bedarf“ ergibt «extend», „kann alles, was …“ ergibt Generalisierung.</li>
<li>Prüfe die Pfeilrichtungen und ergänze die Condition bei «extend».</li></ol></div>
<div class="card"><h3 style="margin-top:0">Checkliste vor der Abgabe</h3>
<ul class="clean"><li>Alle Akteure außen, alle Use Cases im Rahmen?</li><li>Hat das System einen Namen?</li><li>Hat jeder Use Case einen Namen mit Verb?</li><li>Gibt es keine einfachen Linien zwischen zwei Use Cases?</li><li>Zeigt «include» zum eingebundenen und «extend» zum Basis-UC?</li><li>Versuchst du etwa, eine Reihenfolge von Schritten zu zeigen?</li><li>Ist jede Anforderung aus dem Text abgebildet?</li></ul></div>
<div class="card"><h3 style="margin-top:0">Fertige Formulierungen</h3>
<div class="q-box"><b>«include»:</b> „Der Anwendungsfall A schließt den Anwendungsfall B immer ein. B ist ein notwendiger Teil von A und wird bei jeder Ausführung von A durchlaufen.“</div>
<div class="q-box"><b>«extend»:</b> „Der Anwendungsfall B erweitert den Anwendungsfall A nur unter einer bestimmten Bedingung. A ist auch ohne B vollständig.“</div>
<div class="q-box"><b>Akteur:</b> „Ein Akteur ist eine Rolle außerhalb des Systems, die mit dem System interagiert. Das kann eine Person, ein Fremdsystem oder ein Zeitgeber sein.“</div>
<div class="q-box"><b>Zweck:</b> „Das Anwendungsfalldiagramm zeigt, welche Funktionen ein System aus Sicht der Akteure bietet. Es zeigt keine Abläufe und keine Reihenfolge.“</div></div>`};
