<div class="card"><h3 style="margin-top:0">1. Klasse und Objekt</h3>
<p>Eine <b>Klasse</b> ist ein Bauplan: Sie beschreibt, welche Attribute und Methoden alle ihre Objekte haben. Ein <b>Objekt</b> (Instanz) ist ein konkretes Exemplar mit eigenen Attributwerten.</p>
<p>Im <b>Objektdiagramm</b> notiert man ein Objekt als <code>k1 : Kunde</code> (unterstrichen), im Attributbereich stehen die Werte: <code>name = "Müller"</code>.</p></div>

<div class="card"><h3 style="margin-top:0">2. Attribute und Methoden: die vollständige Syntax</h3>
<pre class="code">Sichtbarkeit name : Datentyp [Multiplizität] = Initialwert {Eigenschaft}
Sichtbarkeit name(parameter : Typ, ...) : Rückgabetyp</pre>
<table><tr><th>Notation</th><th>Bedeutung</th></tr>
<tr><td><code>- preis : double = 0.0</code></td><td>private-Attribut mit Anfangswert</td></tr>
<tr><td><code>- telefon : String [0..2]</code></td><td>0 bis 2 Werte</td></tr>
<tr><td><code>/ alter : int</code></td><td><b>abgeleitetes Attribut</b>: wird aus anderen berechnet (aus geburtsdatum)</td></tr>
<tr><td><u><code>- anzahl : int</code></u></td><td><b>Klassenattribut</b> (static): unterstrichen, einmal für die ganze Klasse</td></tr>
<tr><td><code>+ MWST : double = 0.19 {readOnly}</code></td><td>Konstante</td></tr>
<tr><td><code>+ Kunde(name : String)</code></td><td>Konstruktor: Name wie die Klasse, ohne Rückgabetyp</td></tr>
<tr><td><i><code>+ berechnePreis() : double</code></i></td><td>abstrakte Methode: kursiv, ohne Implementierung</td></tr></table>
<div class="tip"><b>Kapselung:</b> Attribute werden <code>private</code> deklariert, der Zugriff erfolgt über Methoden (<code>getName()</code>, <code>setName()</code>). So kontrolliert die Klasse selbst, welche Werte zulässig sind.</div></div>

<div class="card"><h3 style="margin-top:0">3. Multiplizitäten: lesen und setzen</h3>
<p>Die Zahl steht bei der <b>gegenüberliegenden</b> Klasse. Lies immer in beide Richtungen, beginnend mit „<b>Ein</b> …“:</p>
<pre class="code">Kunde 1 ——————— 0..* Bestellung
„Ein Kunde hat beliebig viele (0..*) Bestellungen.“
„Eine Bestellung gehört zu genau einem (1) Kunden.“</pre>
<table><tr><th>Im Text</th><th>Multiplizität</th></tr>
<tr><td>„genau ein“, „immer ein“</td><td><code>1</code></td></tr>
<tr><td>„höchstens ein“, „kann ein … haben“, „optional“</td><td><code>0..1</code></td></tr>
<tr><td>„beliebig viele“, „mehrere“, „kein oder mehrere“</td><td><code>0..*</code> (oder <code>*</code>)</td></tr>
<tr><td>„mindestens ein“</td><td><code>1..*</code></td></tr>
<tr><td>„zwei bis fünf“</td><td><code>2..5</code></td></tr></table>
<p>Eine <b>n:m</b>-Beziehung (<code>*</code> auf beiden Seiten) mit eigenen Daten löst man über eine <b>Assoziationsklasse</b> oder eine eigene Klasse auf: Kunde — <b>Reservierung</b> — Gerät (Reservierung hat beginn und ende).</p></div>

<div class="card"><h3 style="margin-top:0">4. Beziehungsarten: die entscheidenden Fragen</h3>
<ol><li><b>„Ist ein …?“</b> (Laptop ist ein Gerät) → Generalisierung, Dreieck zur Oberklasse.</li>
<li><b>„Verspricht nur Methoden?“</b> → Realisierung zum «interface», gestrichelt mit Dreieck.</li>
<li><b>„Besteht aus / hat Teile?“</b> Dann frage: <b>Verschwinden die Teile zusammen mit dem Ganzen?</b> Ja → Komposition ◆. Nein → Aggregation ◇. Die Raute steht immer beim <b>Ganzen</b>.</li>
<li><b>„Kennt / gehört zu / hat?“</b> ohne Teil-Ganzes-Beziehung → Assoziation.</li>
<li><b>„Benutzt nur kurz?“</b> (als Parameter oder lokale Variable) → Abhängigkeit, gestrichelt mit offener Pfeilspitze.</li></ol>
<p>Zusätzlich kann eine Assoziation haben: <b>Rollenname</b> am Ende (<code>+inhaber</code>), <b>Assoziationsname</b> mit Leserichtung (<code>leiht ▶</code>), <b>Navigierbarkeit</b> (Pfeil: wer kennt wen) und <b>reflexive Assoziation</b> (Mitarbeiter — Mitarbeiter: „ist Vorgesetzter von“).</p>
<div class="tip">Bei einer Komposition darf auf der Seite des Ganzen nur <code>1</code> (oder <code>0..1</code>) stehen: Ein Teil gehört zu genau einem Ganzen.</div></div>

<div class="card"><h3 style="margin-top:0">5. Abstrakte Klasse und Interface</h3>
<table><tr><th></th><th>Abstrakte Klasse</th><th>Interface</th></tr>
<tr><td>Objekte</td><td>nicht erzeugbar</td><td>nicht erzeugbar</td></tr>
<tr><td>Enthält</td><td>Attribute, fertige und abstrakte Methoden</td><td>nur Methodensignaturen (und Konstanten)</td></tr>
<tr><td>Beziehung in UML</td><td>Generalisierung (durchgezogen)</td><td>Realisierung (gestrichelt)</td></tr>
<tr><td>In Java</td><td><code>extends</code>, nur eine Oberklasse</td><td><code>implements</code>, mehrere möglich</td></tr>
<tr><td>Bedeutung</td><td>gemeinsame Basis für verwandte Klassen</td><td>gemeinsamer „Vertrag“ für beliebige Klassen</td></tr></table>
<p><b>Polymorphie:</b> Unterklassen überschreiben eine Methode der Oberklasse. Derselbe Aufruf <code>zahlung.bezahlen()</code> führt je nach tatsächlicher Klasse des Objekts unterschiedlichen Code aus.</p></div>

<div class="card"><h3 style="margin-top:0">6. UML ↔ Code</h3>
<p>In der Prüfung kommt beides vor: „Erstellen Sie das Klassendiagramm zum Code“ und „Implementieren Sie die Klasse“.</p>
<table><tr><th>UML</th><th>Java</th></tr>
<tr><td>Klasse</td><td><code>public class Kunde { }</code></td></tr>
<tr><td><code>- name : String</code></td><td><code>private String name;</code></td></tr>
<tr><td><code>+ getName() : String</code></td><td><code>public String getName() { return name; }</code></td></tr>
<tr><td>Generalisierung</td><td><code>class Laptop extends Geraet</code></td></tr>
<tr><td>Realisierung</td><td><code>class Auto implements Mietbar</code></td></tr>
<tr><td>«abstract»</td><td><code>abstract class Fahrzeug</code></td></tr>
<tr><td>Assoziation zu <code>1</code></td><td><code>private Kunde kunde;</code></td></tr>
<tr><td>Assoziation zu <code>0..*</code></td><td><code>private List&lt;Bestellung&gt; bestellungen;</code></td></tr>
<tr><td>Komposition</td><td>das Teil wird im Ganzen erzeugt: <code>this.motor = new Motor();</code></td></tr>
<tr><td>Aggregation</td><td>das Teil wird von außen übergeben: <code>void add(Fahrzeug f)</code></td></tr>
<tr><td>static</td><td><code>private static int anzahl;</code></td></tr></table>
<div class="tip">Ein Attribut, dessen Typ eine andere Klasse des Modells ist, zeichnet man als <b>Assoziation</b> und wiederholt es nicht im Attributbereich.</div></div>

<div class="card"><h3 style="margin-top:0">7. Vom Text zu den Klassen</h3>
<table><tr><th>Im Text</th><th>Im Diagramm</th></tr>
<tr><td>Substantiv, das Eigenschaften hat</td><td>Klasse</td></tr>
<tr><td>Eigenschaft („hat einen Namen, eine Nummer“)</td><td>Attribut</td></tr>
<tr><td>Verb („kann storniert werden“, „soll prüfen“)</td><td>Methode</td></tr>
<tr><td>„ist ein“, „spezielle Art von“, „zusätzlich hat ein …“</td><td>Generalisierung</td></tr>
<tr><td>„besteht aus“, „ohne … existiert nicht“</td><td>Komposition</td></tr>
<tr><td>„enthält“, „… bleiben bestehen“</td><td>Aggregation</td></tr>
<tr><td>„gibt vor“, „muss umsetzen“, „Schnittstelle“</td><td>Interface + Realisierung</td></tr></table></div>`,
exam:`
<div class="card"><h3 style="margin-top:0">So wird gefragt</h3>
<ul class="clean"><li><b>„Erstellen Sie ein Klassendiagramm …“</b> nach Text: Klassen, Attribute mit Typen, Methoden, Beziehungen, Multiplizitäten.</li>
<li><b>„Ergänzen Sie das Klassendiagramm um …“</b> Eine neue Klasse oder Beziehung in einem fertigen Diagramm. In der AP2 ist das die häufigste Variante.</li>
<li><b>„Erstellen Sie das Klassendiagramm zum folgenden Quellcode“</b> und umgekehrt: <b>„Implementieren Sie die Klasse …“</b></li>
<li><b>„Erläutern Sie den Unterschied zwischen Aggregation und Komposition“</b>, „… zwischen abstrakter Klasse und Interface“.</li>
<li><b>„Was bedeuten die Multiplizitäten an der Assoziation …?“</b> In beide Richtungen lesen.</li>
<li><b>„Welche Attribute und Methoden besitzt ein Objekt der Klasse Laptop?“</b> Eigene plus geerbte.</li></ul></div>
<div class="card"><h3 style="margin-top:0">Lösungsplan</h3>
<ol><li>Markiere die <b>Substantive</b>: Kandidaten für Klassen und Attribute. Was eigene Eigenschaften hat, wird eine Klasse.</li>
<li>Notiere die Klassen mit Attributen: <code>- name : Typ</code>. Den Typ nimmst du aus dem Text; fehlt er, wähle einen sinnvollen (String, int, double, boolean, Date).</li>
<li>Mache aus den Verben Methoden: <code>+ name() : Rückgabetyp</code>.</li>
<li>Finde die Vererbung („ist ein“). Gemeinsame Attribute ziehst du in die Oberklasse hoch.</li>
<li>Verbinde die übrigen Klassen: Assoziation, Aggregation oder Komposition.</li>
<li>Setze Multiplizitäten <b>an beide Enden</b> und lies jede Beziehung laut in beide Richtungen.</li></ol></div>
<div class="card"><h3 style="margin-top:0">Checkliste vor der Abgabe</h3>
<ul class="clean"><li>Hat jedes Attribut Sichtbarkeit und Datentyp?</li><li>Hat jede Methode Klammern und Rückgabetyp?</li><li>Zeigt das Vererbungsdreieck auf die Oberklasse?</li><li>Steht die Raute beim Ganzen?</li><li>Stehen an beiden Enden der Beziehungen Multiplizitäten?</li><li>Gibt es keine Attribute, die eine Beziehung doppelt abbilden?</li><li>Sind abstrakte Klassen und Interfaces gekennzeichnet?</li></ul></div>
<div class="card"><h3 style="margin-top:0">Fertige Formulierungen</h3>
<div class="q-box"><b>Aggregation / Komposition:</b> „Beide beschreiben eine Teil-Ganzes-Beziehung. Bei der Aggregation können die Teile ohne das Ganze weiter existieren (leere Raute). Bei der Komposition sind die Teile existenzabhängig: Wird das Ganze gelöscht, werden auch die Teile gelöscht (ausgefüllte Raute).“</div>
<div class="q-box"><b>Abstrakte Klasse / Interface:</b> „Von beiden können keine Objekte erzeugt werden. Eine abstrakte Klasse kann Attribute und implementierte Methoden enthalten und wird vererbt. Ein Interface gibt nur Methodensignaturen vor, die von den implementierenden Klassen umgesetzt werden müssen. Eine Klasse kann mehrere Interfaces implementieren.“</div>
<div class="q-box"><b>Multiplizität:</b> „Ein Kunde kann beliebig viele Bestellungen haben (0..*). Eine Bestellung gehört zu genau einem Kunden (1).“</div>
<div class="q-box"><b>Kapselung:</b> „Die Attribute sind private und können nur über öffentliche Methoden gelesen oder geändert werden. So schützt die Klasse ihre Daten vor ungültigen Zugriffen.“</div>
<div class="q-box"><b>Vererbung:</b> „Die Unterklasse erbt alle Attribute und Methoden der Oberklasse und kann sie um eigene erweitern oder überschreiben.“</div></div>`};

/* ================= MEHR THEORIE, Teil 2: Zustands-, Aktivitäts-, Sequenzdiagramm ================= */
EXTRA.st={deep:`
<div class="card"><h3 style="margin-top:0">1. Was ist ein Zustand</h3>
<p>Ein Zustand ist eine <b>Situation im Leben eines einzelnen Objekts</b>, die eine gewisse Zeit andauert: Das Objekt wartet auf etwas oder tut etwas. Das Diagramm beschreibt immer <b>ein</b> Objekt (eine Klasse): Bestellung, Ticket, Gerät, Ampel.</p>
<table><tr><th>Richtig (Zustand)</th><th>Falsch (Aktion)</th></tr>
<tr><td>„Bestellt“, „In Bearbeitung“, „Versendet“</td><td>„Bestellung versenden“</td></tr>
<tr><td>„Verfügbar“, „Reserviert“, „Defekt“</td><td>„Gerät reservieren“</td></tr>
<tr><td>„Wartet auf Zahlung“</td><td>„Zahlung prüfen“ (das ist eine Aktion aus dem Aktivitätsdiagramm)</td></tr></table>
<div class="tip"><b>Probe:</b> Setze den Namen in den Satz „Das Objekt <u>ist</u> …“ ein. „Die Bestellung ist <i>versendet</i>“ klingt richtig, also ist es ein Zustand. „Die Bestellung ist <i>versenden</i>“ klingt falsch: Das ist eine Aktion.</div></div>

<div class="card"><h3 style="margin-top:0">2. Transition: die vollständige Syntax</h3>
<div class="q-box" style="font-size:18px;text-align:center"><code>Ereignis [Guard] / Effekt</code></div>
<table><tr><th>Teil</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td><b>Ereignis</b> (Trigger)</td><td>was passiert ist</td><td><code>bezahlen</code>, <code>karteEingeführt</code></td></tr>
<tr><td><b>[Guard]</b> (Bedingung)</td><td>Bedingung in eckigen Klammern; der Übergang schaltet nur, wenn sie wahr ist</td><td><code>[betrag &lt;= kontostand]</code></td></tr>
<tr><td><b>/ Effekt</b> (Aktion)</td><td>was <b>während</b> des Übergangs ausgeführt wird</td><td><code>/ quittungDrucken()</code></td></tr></table>
<p>Alle drei Teile sind optional. Vollständiges Beispiel: <code>pinEingegeben [pin korrekt] / menueAnzeigen()</code>.</p></div>

<div class="card"><h3 style="margin-top:0">3. Ereignisarten</h3>
<table><tr><th>Art</th><th>Notation</th><th>Signal im Text</th></tr>
<tr><td>Signal- oder Aufrufereignis</td><td><code>bestellen</code>, <code>abbrechen()</code></td><td>„der Kunde storniert“, „wird freigegeben“</td></tr>
<tr><td><b>Zeitereignis</b></td><td><code>after(30 s)</code>, <code>after(14 Tage)</code>, <code>at(00:00)</code></td><td>„nach 30 Sekunden“, „nach Ablauf von …“</td></tr>
<tr><td><b>Änderungsereignis</b></td><td><code>when(bestand &lt; 5)</code></td><td>„sobald der Bestand unter 5 fällt“</td></tr>
<tr><td>Ohne Ereignis (Completion)</td><td>nur ein Pfeil oder nur ein <code>[Guard]</code></td><td>der Übergang schaltet von selbst, sobald die do-Aktivität beendet ist</td></tr></table></div>

<div class="card"><h3 style="margin-top:0">4. Interne Aktionen: entry / do / exit</h3>
<pre class="code">┌──────────────────────────┐
│        Ausgeliehen       │
├──────────────────────────┤
│ entry / fristSetzen()    │   einmal beim Betreten
│ do    / tageZaehlen()    │   die ganze Zeit, solange der Zustand aktiv ist
│ exit  / fristLoeschen()  │   einmal beim Verlassen
└──────────────────────────┘</pre>
<ul class="clean"><li><b>entry</b> ist praktisch, wenn mehrere Pfeile in den Zustand führen und überall dieselbe Aktion nötig ist.</li>
<li><b>do</b> dauert an und kann durch ein Ereignis unterbrochen werden. Der Effekt eines Übergangs ist dagegen kurz und wird nicht unterbrochen.</li>
<li>Eine <b>Selbsttransition</b> (Pfeil aus dem Zustand in sich selbst) führt <code>exit</code> und erneut <code>entry</code> aus. Eine <b>interne Transition</b> (Zeile <code>ereignis / aktion</code> im Zustand) führt sie nicht aus.</li></ul></div>

<div class="card"><h3 style="margin-top:0">5. Guards und Verzweigung</h3>
<ul class="clean"><li>Gehen aus einem Zustand bei <b>demselben Ereignis</b> mehrere Pfeile ab, brauchen sie Guards, die <b>sich gegenseitig ausschließen</b>: <code>[pin korrekt]</code> und <code>[pin falsch]</code>.</li>
<li>Die Guards müssen alle Fälle abdecken. Praktisch: <code>[else]</code>.</li>
<li>Überschneiden sich Guards (<code>[x &gt; 5]</code> und <code>[x &gt; 3]</code>), ist der Automat <b>nicht deterministisch</b>: Das ist ein Fehler.</li>
<li>Man kann auch eine Raute (Entscheidung) zeichnen: Hinein führt ein Pfeil mit dem Ereignis, heraus führen Pfeile nur mit Guards.</li></ul></div>

<div class="card"><h3 style="margin-top:0">6. Startzustand, Endzustand und Weiteres</h3>
<table><tr><th>Element</th><th>Regeln</th></tr>
<tr><td><b>Startzustand</b> ●</td><td>genau einer; von ihm geht ein Pfeil <b>ohne Ereignis</b> aus (ein Effekt ist möglich); nichts führt hinein</td></tr>
<tr><td><b>Endzustand</b> ◉</td><td>es kann mehrere oder keinen geben (eine Ampel läuft endlos); nichts führt heraus</td></tr>
<tr><td><b>Zusammengesetzter Zustand</b></td><td>Zustand mit Unterzuständen im Inneren. Ein Pfeil vom Rahmen gilt für alle Unterzustände: praktisch für „abbrechen“ von jeder Stelle aus</td></tr>
<tr><td><b>History</b> (H)</td><td>bei der Rückkehr in den zusammengesetzten Zustand geht es in dem Unterzustand weiter, in dem man war</td></tr></table></div>

<div class="card"><h3 style="margin-top:0">7. Zustandsübergangstabelle</h3>
<p>In Aufgaben muss man manchmal eine Tabelle in ein Diagramm überführen oder umgekehrt. Beispiel für ein Support-Ticket:</p>
<table><tr><th>Ausgangszustand</th><th>Ereignis [Guard]</th><th>Aktion</th><th>Folgezustand</th></tr>
<tr><td>● (Start)</td><td></td><td></td><td>Offen</td></tr>
<tr><td>Offen</td><td>zuweisen</td><td>/ technikerBenachrichtigen()</td><td>In Bearbeitung</td></tr>
<tr><td>In Bearbeitung</td><td>rueckfrageStellen</td><td></td><td>Wartet auf Kunde</td></tr>
<tr><td>Wartet auf Kunde</td><td>antwortErhalten</td><td></td><td>In Bearbeitung</td></tr>
<tr><td>In Bearbeitung</td><td>loesen</td><td></td><td>Gelöst</td></tr>
<tr><td>Gelöst</td><td>after(7 Tage)</td><td></td><td>Geschlossen</td></tr></table>
<div class="tip">Jede Tabellenzeile ist genau ein Pfeil. Zeichne zuerst alle Zustände aus der ersten und der letzten Spalte, dann ergänze Zeile für Zeile die Pfeile.</div></div>

<div class="card"><h3 style="margin-top:0">8. Signalwörter: vom Text zum Diagramm</h3>
<table><tr><th>Im Text steht</th><th>Im Diagramm</th></tr>
<tr><td>„befindet sich im Zustand …“, „ist …“, „gilt als …“</td><td>Zustand</td></tr>
<tr><td>„Nach dem Anlegen ist … zunächst …“, „Ein neues … ist …“</td><td>Pfeil vom Startzustand</td></tr>
<tr><td>„wird …“, „sobald …“, „durch …“, „wenn der Kunde …“</td><td>Ereignis an der Transition</td></tr>
<tr><td>„nur wenn“, „falls“, „sofern“</td><td>[Guard]</td></tr>
<tr><td>„dabei wird …“, „gleichzeitig wird … verschickt“</td><td>/ Effekt</td></tr>
<tr><td>„nach 14 Tagen“, „nach Ablauf“</td><td>after(…)</td></tr>
<tr><td>„kann jederzeit“, „aus jedem Zustand“</td><td>Pfeile aus mehreren Zuständen (oder ein zusammengesetzter Zustand)</td></tr>
<tr><td>„endgültig“, „damit endet der Lebenszyklus“</td><td>Pfeil in den Endzustand</td></tr></table></div>

<div class="card"><h3 style="margin-top:0">9. Vom Diagramm zum Code</h3>
<p>Von Fachinformatikern wird oft die Umsetzung verlangt. Das klassische Muster: ein <code>enum</code> für die Zustände und eine Methode pro Ereignis.</p>
<pre class="code">enum Status { OFFEN, IN_BEARBEITUNG, GELOEST, GESCHLOSSEN }

class Ticket {
    private Status status = Status.OFFEN;          // Startzustand

    public void zuweisen() {                       // Ereignis
        if (status == Status.OFFEN) {              // Ausgangszustand
            technikerBenachrichtigen();            // Effekt
            status = Status.IN_BEARBEITUNG;        // Folgezustand
        }
    }
}</pre>
<p>Ein Ereignis in einem Zustand, in dem es dafür keinen Pfeil gibt, wird <b>ignoriert</b>: Das Objekt bleibt im selben Zustand.</p></div>

<div class="card"><h3 style="margin-top:0">10. Was das Diagramm nicht zeigt</h3>
<ul class="clean"><li>das Zusammenspiel <b>mehrerer</b> Objekte (dafür Sequenzdiagramm);</li><li>einen schrittweisen Ablauf mit Beteiligten (Aktivitätsdiagramm);</li><li>Attribute und Methoden einer Klasse (Klassendiagramm).</li></ul>
<div class="tip"><b>Zustands- oder Aktivitätsdiagramm?</b> Im Zustandsdiagramm sind die Knoten <i>Wartezustände</i> und die Pfeilbeschriftungen Ereignisse. Im Aktivitätsdiagramm sind die Knoten <i>Aktionen</i> und die Pfeile nur die Reihenfolge. Stehen in deinen Rechtecken Verben, zeichnest du ein Aktivitätsdiagramm.</div></div>`,
exam:`
<div class="card"><h3 style="margin-top:0">So wird gefragt</h3>
<ul class="clean"><li><b>„Erstellen Sie ein Zustandsdiagramm für das Objekt …“</b> Text mit einem Lebenszyklus (Bestellung, Ticket, Leihgerät, Benutzerkonto).</li>
<li><b>„Ergänzen Sie die fehlenden Zustände und Transitionen.“</b> Diagramm mit Lücken.</li>
<li><b>„Überführen Sie die Zustandsübergangstabelle in ein Diagramm“</b> oder umgekehrt.</li>
<li><b>„In welchem Zustand befindet sich das Objekt nach den Ereignissen a, b, c?“</b> Das Diagramm durchlaufen.</li>
<li><b>„Erläutern Sie die Beschriftung Ereignis [Bedingung] / Aktion.“</b></li>
<li><b>„Erläutern Sie den Unterschied zwischen entry-, do- und exit-Aktionen.“</b></li>
<li><b>„Implementieren Sie den Zustandsautomaten“</b> (enum + switch/if).</li></ul></div>
<div class="card"><h3 style="margin-top:0">Lösungsplan in 6 Schritten</h3>
<ol><li>Bestimme das <b>Objekt</b>, dessen Lebenszyklus beschrieben wird. Das Diagramm handelt nur von ihm.</li>
<li>Schreibe alle <b>Zustände</b> heraus (Adjektive und Partizipien).</li>
<li>Finde den Anfangszustand und zeichne den Startzustand mit einem Pfeil dorthin.</li>
<li>Frage bei jedem Zustand: „Was kann hier passieren und wohin führt das?“ Das ergibt die Pfeile mit Ereignissen.</li>
<li>Ergänze Guards („nur wenn“) und Effekte („dabei wird“).</li>
<li>Prüfe, ob jeder Zustand erreichbar ist und aus jedem (außer den Endzuständen) ein Weg herausführt. Wird ein Endzustand gebraucht?</li></ol></div>
<div class="card"><h3 style="margin-top:0">Checkliste vor der Abgabe</h3>
<ul class="clean"><li>Sind die Zustandsnamen Zustände und keine Aktionen?</li><li>Genau ein Startzustand, der Pfeil von dort ohne Ereignis?</li><li>Hat jeder andere Pfeil ein Ereignis (oder bewusst nur einen Guard)?</li><li>Stehen die Guards in eckigen Klammern und schließen sie sich gegenseitig aus?</li><li>Steht der Effekt nach dem Schrägstrich?</li><li>Gibt es keine „Sackgassen“ und keine unerreichbaren Zustände?</li><li>Sind alle Ereignisse aus dem Text verwendet?</li></ul></div>
<div class="card"><h3 style="margin-top:0">Fertige Formulierungen</h3>
<div class="q-box"><b>Zweck:</b> „Das Zustandsdiagramm zeigt, welche Zustände ein Objekt im Laufe seines Lebens annehmen kann und durch welche Ereignisse es von einem Zustand in einen anderen wechselt.“</div>
<div class="q-box"><b>Transition:</b> „Die Transition wird durch das Ereignis ausgelöst. Sie wird nur ausgeführt, wenn die Bedingung (Guard) in eckigen Klammern erfüllt ist. Beim Übergang wird die Aktion nach dem Schrägstrich ausgeführt.“</div>
<div class="q-box"><b>entry / do / exit:</b> „Die entry-Aktion wird einmal beim Betreten des Zustands ausgeführt, die do-Aktivität läuft, solange sich das Objekt im Zustand befindet, und die exit-Aktion wird einmal beim Verlassen ausgeführt.“</div>
<div class="q-box"><b>Zustand / Aktion:</b> „Ein Zustand hat eine Dauer: Das Objekt wartet auf ein Ereignis. Eine Aktion ist ein kurzer Vorgang ohne Dauer.“</div>
<div class="q-box"><b>Abgrenzung:</b> „Das Zustandsdiagramm betrachtet genau ein Objekt. Das Aktivitätsdiagramm beschreibt dagegen einen Ablauf, an dem mehrere Beteiligte mitwirken können.“</div></div>`};

EXTRA.ac={deep:`
<div class="card"><h3 style="margin-top:0">1. Die Idee: Ein Token läuft durch das Diagramm</h3>
<p>Stell dir eine Spielmarke (<b>Token</b>) vor, die im Startknoten losläuft und den Pfeilen folgt. Eine Aktion wird ausgeführt, sobald ein Token bei ihr ankommt. Alle Regeln des Diagramms lassen sich über das Token erklären:</p>
<ul class="clean"><li><b>Entscheidung</b> (Raute): Das Token nimmt genau <b>einen</b> Zweig.</li>
<li><b>Fork</b> (Balken): Das Token wird auf alle Ausgänge <b>kopiert</b>, die Zweige laufen parallel.</li>
<li><b>Join</b> (Balken): wartet auf ein Token an <b>allen</b> Eingängen und verschmilzt sie zu einem.</li>
<li><b>Aktivitätsende</b> ◉: vernichtet alle Tokens, die gesamte Aktivität ist beendet.</li>
<li><b>Ablaufende</b> ⊗: vernichtet nur ein Token, die übrigen Zweige laufen weiter.</li></ul></div>

<div class="card"><h3 style="margin-top:0">2. Aktionen</h3>
<p>Eine Aktion ist ein Schritt des Ablaufs in einem Rechteck mit abgerundeten Ecken. Name: <b>Substantiv + Verb</b>: „Bestellung prüfen“, „Rechnung erstellen“.</p>
<ul class="clean"><li>Eine normale Aktion hat <b>einen Eingang und einen Ausgang</b>. Verzweigen und Zusammenführen erfolgt über Raute oder Balken.</li>
<li>Führen zwei Pfeile ohne Merge in eine Aktion, ist das nach UML ein <b>implizites Join</b>: Die Aktion wartet auf ein Token an beiden Pfeilen und startet bei alternativen Zweigen nie. Setze deshalb eine Raute (Zusammenführung) davor.</li>
<li>Halte den Detailgrad einheitlich: Mische nicht „Bestellung abwickeln“ mit „Button klicken“.</li></ul></div>

<div class="card"><h3 style="margin-top:0">3. Entscheidung und Zusammenführung</h3>
<table><tr><th></th><th>Entscheidung (Decision)</th><th>Zusammenführung (Merge)</th></tr>
<tr><td>Pfeile</td><td>1 Eingang, mehrere Ausgänge</td><td>mehrere Eingänge, 1 Ausgang</td></tr>
<tr><td>Beschriftung</td><td>an <b>jedem</b> Ausgang ein Guard: <code>[Lager &gt; 0]</code>, <code>[else]</code></td><td>ohne Beschriftung</td></tr>
<tr><td>Bedeutung</td><td>Auswahl eines Zweigs</td><td>alternative Zweige laufen wieder zusammen</td></tr></table>
<ul class="clean"><li>Guards müssen <b>sich gegenseitig ausschließen</b> und <b>alle Fälle abdecken</b>.</li>
<li>Die Entscheidungsfrage kann neben der Raute oder in der vorherigen Aktion stehen („Lagerbestand prüfen“).</li>
<li>In der Raute steht <b>kein Text</b> (anders als im Programmablaufplan).</li></ul></div>

<div class="card"><h3 style="margin-top:0">4. Schleifen</h3>
<p>Ein eigenes Schleifensymbol gibt es nicht: Eine Schleife ist ein Pfeil zurück zu einem Merge.</p>
<pre class="code">kopfgesteuert (while)                fußgesteuert (do-while)

   ●                                    ●
   ▼                                    ▼
   ◇◄──────────────┐  Merge             ◇◄──────────────┐  Merge
   ▼               │                    ▼               │
   ◇ Entscheidung  │                 [ Aktion ]         │
   │[weiter]       │                    ▼               │
   ▼               │                    ◇ Entscheidung  │
[ Aktion ]─────────┘                    │[nochmal]──────┘
   │[fertig]                            │[fertig]
   ▼                                    ▼
   ◉                                    ◉</pre>
<p>Typisches Beispiel: „PIN eingeben“ wird wiederholt, solange die PIN falsch ist und weniger als drei Versuche gemacht wurden. Der Pfeil zurück führt <b>in den Merge</b> vor der Aktion, nicht direkt in die Aktion.</p></div>

<div class="card"><h3 style="margin-top:0">5. Parallelität: Fork und Join</h3>
<table><tr><th></th><th>Entscheidung / Merge ◇</th><th>Fork / Join ▬</th></tr>
<tr><td>Logik</td><td><b>ODER</b>: ein Zweig wird ausgeführt</td><td><b>UND</b>: alle Zweige werden ausgeführt</td></tr>
<tr><td>Beschriftung</td><td>Guards sind Pflicht</td><td>Guards werden <b>nicht notiert</b></td></tr>
<tr><td>Wird geschlossen durch</td><td>Merge (Raute)</td><td>Join (Balken)</td></tr>
<tr><td>Signal im Text</td><td>„falls“, „wenn“, „entweder … oder“</td><td>„gleichzeitig“, „parallel“, „währenddessen“, „unabhängig voneinander“</td></tr></table>
<div class="tip"><b>Der Hauptfehler:</b> einen Fork öffnen und mit einer Raute schließen (oder umgekehrt). Was ein Balken öffnet, schließt ein Balken. Was eine Raute öffnet, schließt eine Raute.</div></div>

<div class="card"><h3 style="margin-top:0">6. Swimlanes (Partitionen)</h3>
<ul class="clean"><li>Jede Bahn ist ein <b>Verantwortungsbereich</b>: Rolle, Abteilung oder System („Kunde“, „Vertrieb“, „Lager“, „System“).</li>
<li>Eine Aktion steht in der Bahn dessen, der sie <b>ausführt</b>.</li>
<li>Pfeile dürfen Bahngrenzen frei überqueren: So sieht man die Übergabe der Verantwortung.</li>
<li>Der Startknoten steht in der Bahn dessen, der den Ablauf beginnt.</li>
<li>Auch Rauten und Balken liegen in einer Bahn, meist dort, wo die Entscheidung getroffen wird.</li></ul></div>

<div class="card"><h3 style="margin-top:0">7. Weitere Elemente</h3>
<table><tr><th>Element</th><th>Art</th><th>Bedeutung</th></tr>
<tr><td><b>Objektknoten</b></td><td>Rechteck mit dem Objektnamen, optional mit Zustand: <code>Rechnung [bezahlt]</code></td><td>Daten, die zwischen Aktionen übergeben werden (Objektfluss)</td></tr>
<tr><td><b>Signal senden</b></td><td>Fünfeck mit „Pfeil“ nach rechts</td><td>ein Signal senden, ohne auf Antwort zu warten</td></tr>
<tr><td><b>Signal empfangen</b></td><td>Fünfeck mit Einkerbung</td><td>auf ein externes Ereignis warten</td></tr>
<tr><td><b>Zeitereignis</b></td><td>Sanduhr</td><td>„3 Tage warten“, „jeden Montag“</td></tr>
<tr><td><b>Aufruf einer Aktivität</b></td><td>Aktion mit dem „Harken“-Symbol</td><td>der Schritt ist in einem eigenen Diagramm verfeinert</td></tr></table></div>

<div class="card"><h3 style="margin-top:0">8. Code ↔ Aktivitätsdiagramm</h3>
<table><tr><th>Im Code / Pseudocode</th><th>Im Diagramm</th></tr>
<tr><td><code>a(); b();</code></td><td>Aktion a, Pfeil, Aktion b</td></tr>
<tr><td><code>if (x) { a(); } else { b(); }</code></td><td>Entscheidung mit <code>[x]</code> und <code>[else]</code>, zwei Zweige, danach Merge</td></tr>
<tr><td><code>if (x) { a(); }</code></td><td>Entscheidung: Zweig <code>[x]</code> mit Aktion und leerer Zweig <code>[else]</code> direkt in den Merge</td></tr>
<tr><td><code>while (x) { a(); }</code></td><td>Merge, Entscheidung, <code>[x]</code> in die Aktion und zurück in den Merge, <code>[else]</code> weiter</td></tr>
<tr><td><code>do { a(); } while (x);</code></td><td>Merge, Aktion, Entscheidung, <code>[x]</code> zurück in den Merge</td></tr>
<tr><td><code>for (i = 0; i &lt; n; i++)</code></td><td>Aktion „i = 0“, dann wie while mit „i erhöhen“ am Ende des Rumpfs</td></tr>
<tr><td><code>switch (x)</code></td><td>eine Entscheidung mit mehreren Ausgängen</td></tr>
<tr><td><code>return</code> innerhalb eines Zweigs</td><td>Pfeil zum Aktivitätsende</td></tr></table></div>

<div class="card"><h3 style="margin-top:0">9. Signalwörter: vom Text zum Diagramm</h3>
<table><tr><th>Im Text steht</th><th>Im Diagramm</th></tr>
<tr><td>„zuerst“, „anschließend“, „danach“, „zum Schluss“</td><td>Kontrollfluss (Pfeil)</td></tr>
<tr><td>„falls“, „wenn … sonst“, „abhängig von“, „bei Erfolg / bei Fehler“</td><td>Entscheidung mit Guards</td></tr>
<tr><td>„gleichzeitig“, „parallel“, „währenddessen“</td><td>Fork und Join</td></tr>
<tr><td>„solange“, „bis“, „erneut“, „wiederholen“, „maximal dreimal“</td><td>Schleife: Pfeil zurück zum Merge</td></tr>
<tr><td>„Der Kunde …“, „Das Lager …“, „Die Buchhaltung …“</td><td>Swimlanes</td></tr>
<tr><td>„Der Vorgang wird abgebrochen“</td><td>Aktivitätsende in diesem Zweig</td></tr></table></div>

<div class="card"><h3 style="margin-top:0">10. Was das Diagramm nicht zeigt</h3>
<ul class="clean"><li>die Klassenstruktur und die Daten (Klassendiagramm);</li><li>den genauen Nachrichtenaustausch zwischen Objekten (Sequenzdiagramm);</li><li>die Zustände eines einzelnen Objekts (Zustandsdiagramm).</li></ul></div>`,
exam:`
<div class="card"><h3 style="margin-top:0">So wird gefragt</h3>
<ul class="clean"><li><b>„Stellen Sie den Ablauf als Aktivitätsdiagramm dar.“</b> Text mit einer Prozessbeschreibung, oft mit Abteilungen (Swimlanes).</li>
<li><b>„Erstellen Sie ein Aktivitätsdiagramm zu folgendem Pseudocode / Quellcode.“</b></li>
<li><b>„Ergänzen Sie das Diagramm um …“</b> Einen Zweig, eine Schleife oder einen parallelen Abschnitt hinzufügen.</li>
<li><b>„Erläutern Sie den Unterschied zwischen Entscheidung und Parallelisierung.“</b></li>
<li><b>„Welche Aktionen werden ausgeführt, wenn …?“</b> Das Diagramm mit konkreten Werten durchlaufen.</li>
<li><b>„Finden Sie die Fehler.“</b> Fehlende Guards, Fork mit Raute geschlossen, kein Startknoten, Sackgasse.</li></ul></div>
<div class="card"><h3 style="margin-top:0">Lösungsplan in 6 Schritten</h3>
<ol><li>Markiere die <b>Aktionen</b> (Verben) und die <b>Ausführenden</b>.</li>
<li>Gibt es mehrere Ausführende, zeichne gleich Swimlanes.</li>
<li>Setze den Startknoten und baue den „Gutfall“ vom Anfang bis zum Aktivitätsende auf.</li>
<li>Ergänze Entscheidungen mit Guards und alternative Zweige; führe jeden bis zu einem Merge oder bis zum Ende.</li>
<li>Ergänze Schleifen (Pfeil zurück in den Merge) und parallele Abschnitte (Fork … Join).</li>
<li>Fahre mit dem Finger wie ein Token durch: Gibt es überall einen Ausgang? Sind alle Bedingungen aus dem Text berücksichtigt?</li></ol></div>
<div class="card"><h3 style="margin-top:0">Checkliste vor der Abgabe</h3>
<ul class="clean"><li>Gibt es genau einen Startknoten und mindestens einen Endknoten?</li><li>Steht an jedem Ausgang jeder Entscheidung ein Guard in eckigen Klammern?</li><li>Laufen Zweige über einen Merge (Raute) zusammen und nicht direkt in eine Aktion?</li><li>Ist jeder Fork durch einen Join geschlossen, und haben Balken keine Guards?</li><li>Hat jede Aktion einen Eingang und einen Ausgang?</li><li>Sind die Aktionen mit Verben benannt und stehen sie in den richtigen Swimlanes?</li><li>Haben die Pfeile eine Richtung?</li></ul></div>
<div class="card"><h3 style="margin-top:0">Fertige Formulierungen</h3>
<div class="q-box"><b>Zweck:</b> „Das Aktivitätsdiagramm beschreibt den Ablauf eines Prozesses: die einzelnen Aktionen, ihre Reihenfolge, Verzweigungen, Schleifen und parallele Abläufe.“</div>
<div class="q-box"><b>Entscheidung / Parallelisierung:</b> „Bei einer Entscheidung (Raute) wird abhängig von den Bedingungen genau ein Zweig durchlaufen. Bei einer Parallelisierung (Balken) werden alle Zweige nebenläufig ausgeführt. Erst wenn alle Zweige beendet sind, geht es nach der Synchronisation weiter.“</div>
<div class="q-box"><b>Swimlanes:</b> „Verantwortungsbereiche (Partitionen) ordnen die Aktionen den Beteiligten zu. So ist erkennbar, wer welche Aktion ausführt.“</div>
<div class="q-box"><b>Aktivitätsende / Ablaufende:</b> „Das Aktivitätsende beendet die gesamte Aktivität. Das Ablaufende beendet nur den einen Kontrollfluss, alle anderen laufen weiter.“</div>
<div class="q-box"><b>Schleife:</b> „Eine Schleife entsteht, indem der Kontrollfluss nach einer Entscheidung über einen Verbindungsknoten zu einer früheren Aktion zurückgeführt wird.“</div></div>`};

EXTRA.sq={deep:`
<div class="card"><h3 style="margin-top:0">1. Lebenslinien</h3>
<p>Jeder Beteiligte ist ein Rechteck mit einer gestrichelten Linie nach unten. Beschriftung: <code>name : Klasse</code>.</p>
<table><tr><th>Notation</th><th>Bedeutung</th></tr>
<tr><td><code>k1 : Kunde</code></td><td>Objekt k1 der Klasse Kunde</td></tr>
<tr><td><code>: Warenkorb</code></td><td>anonymes Objekt der Klasse Warenkorb (die häufigste Variante)</td></tr>
<tr><td><code>shop</code></td><td>nur der Name des Objekts oder der Rolle</td></tr>
<tr><td>Strichmännchen</td><td>Akteur: Mensch oder externes System, das das Szenario auslöst</td></tr></table>
<ul class="clean"><li>Der <b>Aktivierungsbalken</b> (schmales Rechteck auf der Linie) zeigt, dass das Objekt gerade eine Methode ausführt.</li>
<li>Reihenfolge von links nach rechts: meist Akteur, dann Oberfläche, Logik, Daten.</li>
<li>Die horizontale Position hat keine Bedeutung. Die Zeit läuft nur <b>von oben nach unten</b>.</li></ul></div>

<div class="card"><h3 style="margin-top:0">2. Nachrichtenarten</h3>
<table><tr><th>Art</th><th>Pfeil</th><th>Bedeutung</th></tr>
<tr><td><b>synchron</b></td><td>durchgezogene Linie, <b>gefüllte</b> Pfeilspitze ▶</td><td>Methodenaufruf: Der Sender <b>wartet</b> auf die Antwort</td></tr>
<tr><td><b>asynchron</b></td><td>durchgezogene Linie, <b>offene</b> Pfeilspitze &gt;</td><td>Signal: Der Sender <b>wartet nicht</b> und arbeitet weiter</td></tr>
<tr><td><b>Antwort</b> (Rückgabe)</td><td><b>gestrichelt</b>, offene Pfeilspitze</td><td>Rückgabe des Ergebnisses auf einen synchronen Aufruf</td></tr>
<tr><td><b>Erzeugung</b></td><td>gestrichelt zum <b>Kopf</b> der neuen Linie, «create»</td><td>das Objekt wird in diesem Moment erzeugt (<code>new</code>)</td></tr>
<tr><td><b>Zerstörung</b></td><td>die Linie endet mit einem Kreuz ✕</td><td>das Objekt ist gelöscht</td></tr>
<tr><td><b>Selbstaufruf</b></td><td>Pfeilschleife auf dieselbe Linie</td><td>das Objekt ruft eine eigene Methode auf</td></tr></table>
<p>Beschriftung einer Nachricht: <code>methodenName(parameter)</code>, zum Beispiel <code>pruefePin(pin)</code>. Beschriftung einer Antwort: der Rückgabewert, zum Beispiel <code>true</code>, <code>preis</code> oder <code>ok = pruefePin(pin)</code>.</p>
<div class="tip"><b>Regel:</b> Zeichne zu jedem synchronen Aufruf, dessen Ergebnis wichtig ist, eine Antwort. Antworten auf Aufrufe ohne Ergebnis (<code>void</code>) darf man weglassen, dann aber einheitlich im ganzen Diagramm.</div></div>

<div class="card"><h3 style="margin-top:0">3. Kombinierte Fragmente</h3>
<p>Rahmen mit dem Operator in der linken oberen Ecke und dem Guard in eckigen Klammern.</p>
<table><tr><th>Operator</th><th>Bedeutung</th><th>Entsprechung im Code</th></tr>
<tr><td><b>alt</b></td><td>Alternativen: mehrere Bereiche, durch gestrichelte Linien getrennt, jeder mit Guard; genau einer wird ausgeführt</td><td><code>if … else</code></td></tr>
<tr><td><b>opt</b></td><td>Option: ein Bereich, wird nur ausgeführt, wenn der Guard wahr ist</td><td><code>if</code> ohne else</td></tr>
<tr><td><b>loop</b></td><td>Wiederholung: <code>loop [für jede Position]</code>, <code>loop(1,3)</code></td><td><code>for</code>, <code>while</code></td></tr>
<tr><td><b>par</b></td><td>die Bereiche werden parallel ausgeführt</td><td>Threads</td></tr>
<tr><td><b>break</b></td><td>ist der Guard wahr, wird der Bereich ausgeführt und das umgebende Fragment verlassen</td><td><code>break</code>, <code>return</code></td></tr>
<tr><td><b>ref</b></td><td>Verweis auf ein anderes Sequenzdiagramm</td><td>Aufruf eines Unterprogramms</td></tr></table>
<ul class="clean"><li>Der Rahmen muss <b>alle Lebenslinien</b> umfassen, die an den Nachrichten darin beteiligt sind.</li>
<li>Fragmente lassen sich verschachteln: <code>loop</code> mit <code>alt</code> darin.</li>
<li>Ein <b>alt</b> hat mindestens zwei Bereiche; der letzte ist oft <code>[else]</code>. Ein einzelner Bereich mit Bedingung ist ein <b>opt</b>.</li></ul></div>

<div class="card"><h3 style="margin-top:0">4. Bezug zum Klassendiagramm</h3>
<p>Das ist eine beliebte Stelle für Fragen wie „Welche Methoden muss die Klasse … besitzen?“.</p>
<ul class="clean"><li>Eine Nachricht <code>m()</code> von A an B bedeutet: Die Methode <code>m()</code> ist in der Klasse des <b>Empfängers B</b> deklariert.</li>
<li>Damit A B aufrufen kann, braucht es zwischen ihren Klassen eine <b>Assoziation</b> (A kennt B).</li>
<li>Parameter und Rückgabewerte müssen zu den Signaturen im Klassendiagramm passen.</li>
<li>«create» entspricht dem Aufruf des Konstruktors.</li></ul></div>

<div class="card"><h3 style="margin-top:0">5. Code ↔ Sequenzdiagramm</h3>
<pre class="code">class Kasse {
    void verkaufe(Artikel a, Lager lager) {
        if (lager.istVerfuegbar(a)) {          // synchron + Antwort
            double p = a.getPreis();           // synchron + Antwort
            Beleg b = new Beleg(p);            // «create»
            b.drucken();                       // synchron
        } else {
            anzeigen("nicht lieferbar");       // Selbstaufruf
        }
    }
}</pre>
<table><tr><th>Im Code</th><th>Im Diagramm</th></tr>
<tr><td><code>objekt.methode(x)</code></td><td>synchrone Nachricht <code>methode(x)</code> an die Linie objekt</td></tr>
<tr><td><code>wert = objekt.methode()</code></td><td>Nachricht und gestrichelte Antwort <code>wert</code></td></tr>
<tr><td><code>new Klasse()</code></td><td>«create» zum Kopf der neuen Lebenslinie</td></tr>
<tr><td><code>if / else</code></td><td>alt mit zwei Bereichen</td></tr>
<tr><td><code>if</code> ohne else</td><td>opt</td></tr>
<tr><td><code>for</code>, <code>while</code></td><td>loop</td></tr>
<tr><td><code>this.methode()</code></td><td>Selbstaufruf</td></tr></table></div>

<div class="card"><h3 style="margin-top:0">6. Signalwörter: vom Text zum Diagramm</h3>
<table><tr><th>Im Text steht</th><th>Im Diagramm</th></tr>
<tr><td>„ruft … auf“, „fragt … ab“, „prüft bei …“, „wartet auf das Ergebnis“</td><td>synchron + Antwort</td></tr>
<tr><td>„benachrichtigt“, „sendet eine E-Mail“, „ohne auf Antwort zu warten“, „stößt an“</td><td>asynchron</td></tr>
<tr><td>„liefert … zurück“, „meldet … zurück“, „antwortet mit“</td><td>Antwort (gestrichelt)</td></tr>
<tr><td>„wenn … sonst …“, „bei Erfolg … andernfalls …“</td><td>alt</td></tr>
<tr><td>„falls gewünscht“, „optional“, „nur wenn“</td><td>opt</td></tr>
<tr><td>„für jede Position“, „solange“, „bis zu dreimal“</td><td>loop</td></tr>
<tr><td>„wird erzeugt“, „legt ein neues … an“</td><td>«create»</td></tr></table></div>

<div class="card"><h3 style="margin-top:0">7. Typische Kette in einer Anwendung</h3>
<pre class="code">Benutzer → : Oberfläche → : Controller / Service → : Datenbank / Repository</pre>
<p>Die Anfrage läuft von links nach rechts, die Antworten kommen in umgekehrter Reihenfolge zurück: Wer zuletzt aufgerufen hat, bekommt zuerst die Antwort. Ein Objekt kann nicht antworten, solange es selbst auf die Antwort des nächsten wartet.</p></div>

<div class="card"><h3 style="margin-top:0">8. Was das Diagramm nicht zeigt</h3>
<ul class="clean"><li>alle möglichen Wege auf einmal: Ein Sequenzdiagramm zeigt <b>ein Szenario</b> (mit Fragmenten einige Varianten);</li><li>Attribute und die vollständige Klassenstruktur (Klassendiagramm);</li><li>die Zustände eines Objekts (Zustandsdiagramm);</li><li>den Ablauf aus Sicht der Abteilungen (Aktivitätsdiagramm).</li></ul></div>`,

<ul class="clean"><li><b>„Erstellen Sie ein Sequenzdiagramm für den beschriebenen Ablauf.“</b> Text eines Szenarios mit Beteiligten.</li>
<li><b>„Erstellen Sie ein Sequenzdiagramm zum Quellcode.“</b> Eine Methode in Java/C#, die Aufrufe sind darzustellen.</li>
<li><b>„Ergänzen Sie die fehlenden Nachrichten / das Fragment.“</b></li>
<li><b>„Welche Methoden benötigt die Klasse …?“</b> An den eingehenden Pfeilen ablesen.</li>
<li><b>„Erläutern Sie den Unterschied zwischen synchronen und asynchronen Nachrichten.“</b></li>

<li>Ergänze gestrichelte Antworten dort, wo ein Ergebnis zurückkommt.</li>
<li>Finde Bedingungen und Wiederholungen und rahme die betroffenen Nachrichten mit alt / opt / loop samt Guards ein.</li>
<li>Prüfe: Die Pfeile laufen zeitlich strikt von oben nach unten, zu jedem Aufruf gibt es einen Empfänger mit dieser Methode.</li></ol></div>
<div class="card"><h3 style="margin-top:0">Checkliste vor der Abgabe</h3>
<ul class="clean"><li>Haben alle Lebenslinien eine Beschriftung (<code>: Klasse</code>)?</li><li>Aufrufe durchgezogen, Antworten gestrichelt?</li><li>Pfeilspitzen: gefüllt für synchron, offen für asynchron und Antwort?</li><li>Ist jede Nachricht beschriftet?</li><li>Haben die Fragmente Operator und Guard, hat alt mindestens zwei Bereiche?</li><li>Steht die Antwort unter ihrem Aufruf und läuft sie in die Gegenrichtung?</li><li>Entspricht die Reihenfolge der Nachrichten dem Text?</li></ul></div>
<div class="card"><h3 style="margin-top:0">Fertige Formulierungen</h3>
<div class="q-box"><b>Zweck:</b> „Das Sequenzdiagramm zeigt den zeitlichen Ablauf des Nachrichtenaustauschs zwischen Objekten in einem konkreten Szenario. Die Zeit verläuft von oben nach unten.“</div>
<div class="q-box"><b>synchron / asynchron:</b> „Bei einer synchronen Nachricht wartet der Sender, bis der Empfänger die Verarbeitung beendet hat und antwortet (ausgefüllte Pfeilspitze). Bei einer asynchronen Nachricht arbeitet der Sender sofort weiter, ohne auf eine Antwort zu warten (offene Pfeilspitze).“</div>
<div class="q-box"><b>alt / opt / loop:</b> „alt beschreibt Alternativen, von denen genau eine ausgeführt wird (if-else). opt beschreibt einen optionalen Teil, der nur bei erfüllter Bedingung ausgeführt wird (if ohne else). loop beschreibt eine Wiederholung, solange die Bedingung gilt.“</div>
<div class="q-box"><b>Lebenslinie / Aktivierung:</b> „Die Lebenslinie stellt die Existenz eines Objekts über die Zeit dar. Der Aktivierungsbalken zeigt, in welchem Zeitraum das Objekt eine Methode ausführt.“</div>
<div class="q-box"><b>Bezug zum Klassendiagramm:</b> „Jede Nachricht entspricht einer Methode in der Klasse des Empfängers. Zwischen den Klassen von Sender und Empfänger muss eine Beziehung bestehen.“</div></div>`};

 {q:'„Bestellung aufgeben“ ——«include»——▷ „Zahlung durchführen“. Was bedeutet das?',o:['Bei jeder Bestellung wird zwingend die Zahlung ausgeführt','Die Zahlung wird manchmal ausgeführt','Die Zahlung ist eine Unterart der Bestellung','Erst die Zahlung, dann die Bestellung'],a:0,e:'«include» heißt „immer“. Über die Reihenfolge der Schritte sagt das Diagramm nichts.'},
 {q:'Was davon ist KEIN Use Case?',o:['Passwortfeld anklicken','Artikel suchen','Bestellung stornieren','Rechnung drucken'],a:0,e:'Ein Klick auf ein Feld ist ein Bedienschritt, keine abgeschlossene Funktion mit einem Ergebnis für den Akteur.'},
 {q:'Was ist ein Primärakteur?',o:['Derjenige, der den Use Case auslöst und das Ergebnis erhält','Der wichtigste Mitarbeiter der Firma','Ein externes System rechts vom Rahmen','Der Akteur mit den meisten Linien'],a:0,e:'Der Primärakteur initiiert den Use Case. Der Sekundärakteur wird vom System zur Ausführung benötigt (zum Beispiel Zahlungsdienst).'},
 {q:'Der Akteur „Administrator“ ist über eine Generalisierung mit dem Akteur „Benutzer“ verbunden. Was erbt der Administrator?',o:['Alle Beziehungen von Benutzer zu Use Cases','Nur den Namen','Nichts, das ist nur eine Kennzeichnung','Nur die «include»-Beziehungen'],a:0,e:'Der spezialisierte Akteur kann alles, was der allgemeine kann, plus Eigenes. Deshalb werden die gemeinsamen Use Cases nicht noch einmal mit ihm verbunden.'},
 {q:'Was ist die Vorbedingung in einer Anwendungsfallbeschreibung?',o:['Was vor Beginn des Use Case erfüllt sein muss','Das Ergebnis nach erfolgreichem Abschluss','Die Bedingung bei «extend»','Der erste Schritt des Standardablaufs'],a:0,e:'Zum Beispiel: „Kunde ist angemeldet“. Das Ergebnis beschreibt die Nachbedingung.'},
 {q:'Was ist ein Extension Point?',o:['Die Stelle im Basis-Use-Case, an der eine Erweiterung einsetzen kann','Ein Punkt auf der Systemgrenze','Das Ende eines «include»-Pfeils','Eine besondere Art von Akteur'],a:0,e:'Der Extension Point wird im Basis-Use-Case benannt; «extend» verweist zusammen mit der Condition darauf.'},
 {q:'„Kunden können Artikel suchen. Um zu bestellen, muss der Kunde angemeldet sein.“ Wie hängen „Artikel bestellen“ und „Anmelden“ zusammen?',o:['„Artikel bestellen“ «include» „Anmelden“','„Anmelden“ «extend» „Artikel bestellen“','Generalisierung','Einfache Linie zwischen den Use Cases'],a:0,e:'„muss“ und „setzt voraus“ sind Signale für «include». Einfache Linien zwischen Use Cases gibt es nicht.'}],

 {q:'Wie kennzeichnet man eine abstrakte Klasse?',o:['Name kursiv oder {abstract}','Name unterstreichen','«interface» über dem Namen','Zeichen # vor dem Namen'],a:0,e:'Unterstreichen bedeutet static, «interface» ist eine andere Art von Element.'},
 {q:'Student und Kurs stehen in einer n:m-Beziehung, und zu jeder Belegung gibt es „note“ und „datum“. Wohin gehören diese Attribute?',o:['In eine Assoziationsklasse (zum Beispiel Belegung)','In Student','In Kurs','In beide Klassen'],a:0,e:'Das Attribut gehört zur Beziehung selbst. Eine Assoziationsklasse hängt gestrichelt an der Linie oder wird durch eine eigene Klasse mit zwei 1:n-Beziehungen ersetzt.'},
 {q:'Bestellung ————&gt; Kunde (offene Pfeilspitze an der Linie). Was bedeutet das?',o:['Bestellung kennt ihren Kunde (Navigierbarkeit)','Bestellung erbt von Kunde','Kunde hängt von Bestellung ab','Kunde ist ein Teil von Bestellung'],a:0,e:'Eine offene Pfeilspitze an einer durchgezogenen Linie zeigt die Navigationsrichtung: Die Klasse Bestellung hält eine Referenz auf Kunde.'},
 {q:'Was bedeutet <code>/ gesamtpreis : double</code>?',o:['Abgeleitetes Attribut: wird aus anderen berechnet','private-Attribut','static-Attribut','Konstante'],a:0,e:'Schrägstrich vor dem Namen: Der Wert wird nicht gespeichert, sondern berechnet.'},
 {q:'„Jeder Mitarbeiter gehört zu genau einer Abteilung. Eine Abteilung hat mindestens einen Mitarbeiter.“ Multiplizitäten?',o:['Mitarbeiter 1..* —— 1 Abteilung','Mitarbeiter 1 —— 1..* Abteilung','Mitarbeiter 0..* —— 0..1 Abteilung','Mitarbeiter * —— * Abteilung'],a:0,e:'Die Multiplizität steht an dem Ende, um dessen Anzahl es geht: Bei Abteilung steht 1, bei Mitarbeiter steht 1..*.'},
 {q:'Kann eine Klasse mehrere Interfaces realisieren?',o:['Ja','Nein, nur eines','Nur wenn sie abstract ist','Nur in UML, nicht in Java'],a:0,e:'Erben (extends) kann man in Java von einer Klasse, realisieren (implements) kann man beliebig viele Interfaces.'},
 {q:'Was ist ein Rollenname am Ende einer Assoziation?',o:['Der Name, unter dem die Klasse in dieser Beziehung auftritt','Der Name einer Methode','Der Name eines Pakets','Die Sichtbarkeit der Klasse'],a:0,e:'Zum Beispiel Person —— Firma mit den Rollen „arbeitnehmer“ und „arbeitgeber“. Im Code ist das meist der Name des Referenzattributs.'}],
st:[

 {q:'Aus einem Zustand gehen beim Ereignis „prüfen“ zwei Pfeile mit den Guards [x &gt; 5] und [x &gt; 3] ab. Wo liegt das Problem?',o:['Die Guards überschneiden sich: Bei x = 7 ist unklar, wohin es geht','Zwei Pfeile mit demselben Ereignis sind nicht erlaubt','Guards dürfen keine Zahlen enthalten','Es gibt kein Problem'],a:0,e:'Guards müssen sich gegenseitig ausschließen, sonst ist der Automat nicht deterministisch.'},
 {q:'In den Zustand „Gesperrt“ führen drei Pfeile, und jedes Mal soll eine E-Mail gesendet werden. Wie notiert man das am besten?',o:['entry / emailSenden() im Zustand','Effekt an einem der Pfeile','do / emailSenden()','exit / emailSenden() in den vorherigen Zuständen'],a:0,e:'entry wird bei jedem Betreten ausgeführt, unabhängig vom Weg.'},
 {q:'Worin unterscheidet sich eine interne Transition von einer Selbsttransition?',o:['Sie führt exit und entry nicht aus','Sie hat kein Ereignis','Sie führt in den Endzustand','Gar nicht'],a:0,e:'Eine Selbsttransition verlässt den Zustand und betritt ihn neu (exit, dann entry). Eine interne Transition verlässt den Zustand nicht.'},
 {q:'„Wird die Bestellung nicht innerhalb von 14 Tagen bezahlt, wird sie automatisch storniert.“ Wie modelliert man das?',o:['Transition after(14 Tage) nach „Storniert“','Guard [14 Tage] ohne Ereignis','do / 14 Tage warten','Eigener Zustand „14 Tage“'],a:0,e:'Der Ablauf einer Frist ist ein Zeitereignis: after(…).'},
 {q:'Der Pfeil „abbrechen“ geht vom Rahmen eines zusammengesetzten Zustands aus. Was bedeutet das?',o:['Der Übergang ist aus jedem Unterzustand möglich','Der Übergang ist nur aus dem ersten Unterzustand möglich','Die Unterzustände werden gelöscht','Das ist ein Notationsfehler'],a:0,e:'So vermeidet man gleiche Pfeile aus jedem Unterzustand.'},
 {q:'Wofür eignet sich ein Zustandsdiagramm?',o:['Lebenszyklus einer Bestellung (offen, bezahlt, versendet)','Ablauf des Bestellprozesses zwischen Abteilungen','Aufbau der Klassen im Shop','Funktionen des Shops für den Kunden'],a:0,e:'Ein Zustandsdiagramm beschreibt ein einzelnes Objekt mit seinen Status. Ein Ablauf zwischen Abteilungen gehört ins Aktivitätsdiagramm.'},
 {q:'Ein Pfeil hat weder Ereignis noch Guard. Wann schaltet er?',o:['Sofort nach Ende der do-Aktivität des Zustands','Nie','Bei jedem beliebigen Ereignis','Nur beim Abschalten des Systems'],a:0,e:'Das ist ein Übergang bei Abschluss (Completion-Transition).'}],

 {q:'<code>while (versuche &lt; 3 &amp;&amp; !ok) { pinEingeben(); }</code> Wie sieht das aus?',o:['Merge, Entscheidung, Aktion und Pfeil zurück in den Merge','Fork und Join','Zwei Aktionen hintereinander','Drei Aktionen „PIN eingeben“ hintereinander'],a:0,e:'Die Bedingung wird vor dem Rumpf geprüft: kopfgesteuerte Schleife.'},
 {q:'Braucht man Guards an den Ausgängen eines Forks?',o:['Nein','Ja, an jedem','Nur [else]','Nur an einem'],a:0,e:'Nach einem Fork werden alle Zweige ausgeführt, es gibt nichts auszuwählen.'},

 {q:'<code>if (lagerbestand == 0) { nachbestellen(); }</code> ohne else. Wie zeichnet man das?',o:['Entscheidung: Zweig [Bestand = 0] mit Aktion und Zweig [else] direkt in den Merge','Nur die Aktion „nachbestellen“','Fork mit einem Zweig','Entscheidung mit einem Ausgang'],a:0,e:'Eine Entscheidung braucht mindestens zwei Ausgänge; der leere Zweig führt direkt zur Zusammenführung.'},
 {q:'Der Knoten „Rechnung [bezahlt]“ (Rechteck mit geraden Ecken) ist…',o:['Objektknoten: ein Objekt in einem bestimmten Zustand','Aktion','Guard','Swimlane'],a:0,e:'Ein Objektknoten zeigt Daten, die zwischen Aktionen übergeben werden.'},
 {q:'Ein Fork hat zwei Zweige geöffnet, geschlossen werden sie mit einer Raute (Merge). Was passiert?',o:['Nach der Raute laufen zwei Tokens weiter: Die folgenden Aktionen werden doppelt ausgeführt','Alles in Ordnung','Der Ablauf bleibt für immer stehen','Ein Zweig wird abgebrochen'],a:0,e:'Ein Merge synchronisiert nicht, er lässt jedes Token durch. Parallele Zweige schließt ein Join.'}],

 {id:'o-uc1',type:'uc',pts:4,q:'Erläutern Sie den Unterschied zwischen einer «include»- und einer «extend»-Beziehung.',ru:'Erkläre den Unterschied und die Pfeilrichtung.',
  kw:[['immer','zwingend','notwendig','jedes mal','stets','in jedem fall'],['bedingung','optional','nur wenn','unter umstaenden','nicht immer','kann'],['basis','richtung','zeigt','pfeil'],['vollstaendig','auch ohne','eigenstaendig','erweitert']],
  a:'Bei «include» wird der eingebundene Anwendungsfall immer ausgeführt, er ist ein notwendiger Teil des Basisanwendungsfalls. Der Pfeil zeigt vom Basisanwendungsfall zum eingebundenen Anwendungsfall. Bei «extend» wird der Basisanwendungsfall nur unter einer bestimmten Bedingung erweitert; er ist auch ohne die Erweiterung vollständig. Der Pfeil zeigt vom erweiternden zum erweiterten Anwendungsfall.'},
 {id:'o-uc2',type:'uc',pts:3,q:'Erklären Sie den Begriff „Akteur“ und nennen Sie zwei Arten von Akteuren.',ru:'Definition und zwei Arten.',

  a:'Ein Akteur ist eine Rolle außerhalb des Systems, die mit dem System interagiert. Akteure können Personen (z. B. Kunde, Administrator), Fremdsysteme (z. B. Zahlungsdienst) oder auch ein Zeitgeber sein.'},
 {id:'o-uc3',type:'uc',pts:2,q:'Welche Frage beantwortet ein Anwendungsfalldiagramm, und was zeigt es ausdrücklich nicht?',ru:'Leitfrage und Einschränkung.',

 {id:'o-uc4',type:'uc',pts:3,q:'Was bedeutet eine Generalisierung zwischen zwei Akteuren? Geben Sie ein Beispiel.',ru:'Vererbung zwischen Akteuren und ein Beispiel.',

 {id:'o-uc5',type:'uc',pts:2,q:'Wozu dient die Systemgrenze im Anwendungsfalldiagramm?',ru:'Wozu der Systemrahmen dient.',

 {id:'o-uc6',type:'uc',pts:4,q:'Nennen Sie vier Bestandteile einer tabellarischen Anwendungsfallbeschreibung.',ru:'Vier Punkte der Use-Case-Beschreibungstabelle.',

 {id:'o-uc7',type:'uc',pts:2,q:'Wie sollte ein Anwendungsfall benannt werden? Geben Sie ein gutes und ein schlechtes Beispiel.',ru:'Namensregel und zwei Beispiele.',

 /* ---------- Klassendiagramm ---------- */
 {id:'o-cl1',type:'cl',pts:4,q:'Erläutern Sie den Unterschied zwischen Aggregation und Komposition und nennen Sie je ein Beispiel.',ru:'Unterschied, Rauten, Beispiele.',
  kw:[['teil','ganzes','besteht aus','hat'],['existenzabhaengig','existieren nicht','geloescht','zerstoert','nicht ohne'],['weiter existieren','unabhaengig','ohne das ganze','bestehen bleiben','auch ohne'],['ausgefuellt','gefuellt','leere','schwarze','weisse']],
  a:'Beide beschreiben eine Teil-Ganzes-Beziehung. Bei der Aggregation (leere Raute) können die Teile unabhängig vom Ganzen weiter existieren, z. B. Verein und Mitglied. Bei der Komposition (ausgefüllte Raute) sind die Teile existenzabhängig: Wird das Ganze gelöscht, werden auch die Teile gelöscht, z. B. Rechnung und Rechnungsposition.'},
 {id:'o-cl2',type:'cl',pts:4,q:'Vergleichen Sie abstrakte Klasse und Interface.',ru:'Gemeinsamkeiten und Unterschiede.',
  kw:[['keine objekte','nicht instanzi','keine instanz'],['implementiert','attribute','konkrete methoden','methoden mit'],['signatur','nur methoden','ohne implementierung','vorgibt','vorschreib','vertrag'],['mehrere','mehrfach','erbt','vererb','extends','implements']],
  a:'Von beiden können keine Objekte erzeugt werden. Eine abstrakte Klasse kann Attribute und bereits implementierte Methoden enthalten und wird vererbt (eine Klasse erbt nur von einer Oberklasse). Ein Interface gibt nur Methodensignaturen ohne Implementierung vor; die realisierende Klasse muss alle Methoden umsetzen. Eine Klasse kann mehrere Interfaces implementieren.'},
 {id:'o-cl3',type:'cl',pts:4,q:'Nennen Sie die vier Sichtbarkeiten in UML mit ihrem Symbol und ihrer Bedeutung.',ru:'+ − # ~',
  kw:[['public','oeffentlich'],['private','privat'],['protected','geschuetzt'],['package','paket']],
  a:'+ public: von überall sichtbar. − private: nur innerhalb der eigenen Klasse. # protected: in der Klasse und in ihren Unterklassen. ~ package: innerhalb desselben Pakets.'},
 {id:'o-cl4',type:'cl',pts:3,q:'Was versteht man unter Kapselung (Datenkapselung), und wie wird sie umgesetzt?',ru:'Definition und Umsetzung.',
  kw:[['private','privat','verborgen','versteckt','geschuetzt'],['methoden','getter','setter','schnittstelle'],['zugriff','kontroll','pruef','gueltig','schuetz']],
  a:'Kapselung bedeutet, dass die Attribute eines Objekts vor direktem Zugriff von außen geschützt sind. Die Attribute werden als private deklariert, der Zugriff erfolgt nur über öffentliche Methoden (Getter/Setter). So kann die Klasse Werte prüfen und ungültige Zustände verhindern.'},
 {id:'o-cl5',type:'cl',pts:3,q:'Erklären Sie den Begriff Vererbung (Generalisierung) und nennen Sie einen Vorteil.',ru:'Definition und ein Vorteil.',
  kw:[['unterklasse','subklasse','kindklasse','abgeleitete'],['erbt','uebernimmt','attribute und methoden'],['wiederverwend','redundanz','doppelt','erweiter','wartbar','polymorph']],

 {id:'o-cl6',type:'cl',pts:2,q:'Lesen Sie die Beziehung in beide Richtungen: Kunde 1 —— 0..* Bestellung.',ru:'Lies die Beziehung in beide Richtungen.',

const nrmDE=s=>String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[„“"«»]/g,'').replace(/\s+/g,' ');
/* Stichwortbewertung einer offenen Antwort: liefert {pts,max,hit:[bool je Gruppe]} */
function scoreOpen(q,ans){const t=nrmDE(ans);const hit=q.kw.map(g=>g.some(k=>t.includes(nrmDE(k))));const need=q.max||q.kw.length;const n=Math.min(need,hit.filter(Boolean).length);
 return {pts:Math.round(q.pts*n/need*2)/2,max:q.pts,hit};}

const DTF={uc:'Anwendungsfalldiagramm',cl:'Klassendiagramm',st:'Zustandsdiagramm',ac:'Aktivitätsdiagramm',sq:'Sequenzdiagramm'};

if(!store.lastTask)store.lastTask={};
const AI={fn:null,ready:false,off:false,gen:false,genErr:''};
const tasksOf=type=>DRAW_TASKS.filter(t=>t.type===type);
const customOf=type=>store.custom&&store.custom[type]||null;
function findTask(type,id){if(id==='free')return null;const c=customOf(type);if(c&&c.id===id)return c;return tasksOf(type).find(t=>t.id===id)||null;}
function flushDoc(){if(!Pz.doc)return;clearTimeout(saveT);store.draw[taskKey()]=Pz.doc;save();}
function stopAI(){const a=Pz.ai;if(a&&a.ctl){try{a.ctl.abort();}catch(e){}}}
function openTask(type,id){flushDoc();stopAI();Pz.type=type;
 if(id===undefined)id=store.lastTask[type];
 Pz.task=id==='free'?null:(findTask(type,id)||(id===undefined?tasksOf(type)[0]:null));
 store.lastTask[type]=Pz.task?Pz.task.id:'free';store.lastType=type;loadDoc();Pz.sol=false;save();}
function goDraw(type,id){if(typeof leavePage==='function')leavePage();openTask(type||Pz.type,id);route={page:'draw'};render();window.scrollTo(0,0);}
function pickTask(type,id){openTask(type,id);renderDraw();}

function renderDraw(){
 if(!Pz.doc)openTask(DTF[store.lastType]?store.lastType:Pz.type);

 const best=id=>store.drawBest[id]!=null?` · bestes Ergebnis ${store.drawBest[id]}%`:'';
 let h=`<h1>Praxis: Diagramme zeichnen</h1><p class="sub">Wähle Typ und Aufgabe, zeichne deine Lösung und lass sie prüfen. Alle Aufgaben nach Formaten findest du im <a href="#" onclick="go('bank');return false">Aufgabenpool</a>. Die Zeichnung wird für jede Aufgabe automatisch gespeichert.</p>`;
 h+=`<div class="seg" role="tablist">${Object.keys(DTF).map(k=>`<button class="${k===ty?'on':''}" onclick="pickTask('${k}')">${DTF[k]}</button>`).join('')}</div>`;
 h+=`<div class="card"><div class="row"><label for="tsel"><b>Aufgabe</b></label><select id="tsel" onchange="pickTask('${ty}',this.value)" style="flex:1;min-width:200px">`+

  (c?`<option value="${c.id}" ${t&&t.id===c.id?'selected':''}>🎲 Von der KI: ${esc(c.t)}</option>`:'')+
  `<option value="free" ${!t?'selected':''}>Freies Zeichnen (ohne Aufgabe)</option></select><span id="genbtn"></span></div>`;
 h+=t?`<div style="margin-top:10px">${t.text}</div>`:`<p class="hint" style="margin-top:10px">Zeichne, was du möchtest. Der Bot prüft nur die Notationsregeln, der KI-Tutor bewertet das ganze Diagramm.</p>`;
 h+=`</div>`;
 h+=edHTML(sq);
 h+=`<div class="row"><button class="btn primary" onclick="runCheck()">✔ Mit dem Bot prüfen</button>${t?`<button class="btn" id="solbtn" onclick="toggleSol()">Lösung anzeigen</button>`:''}<button class="btn" onclick="saveImage()">🖼 Als Bild speichern</button><span class="lvl" id="imgmsg" aria-live="polite"></span></div><div id="imgbox"></div>`;
 h+=`<div id="fb"></div><div id="solbox"></div><div id="aibox"></div>`;

/* ----- Prüfung durch den Bot ----- */
function docEmpty(d){return d.type==='sq'?!d.parts.length:!d.nodes.length;}
function runCheck(){const d=Pz.doc,t=Pz.task;
 if(docEmpty(d)){Pz.fb={empty:true};renderFb();return;}
 const g=gradeDoc(d,t),all=g.all,R=g.R,pct=g.pct;
 if(pct!=null){store.drawBest[t.id]=Math.max(store.drawBest[t.id]||0,pct);if(typeof statAdd==='function')statAdd(t.type,pct,100);save();}
 Pz.fb={all,R,pct,at:Date.now()};Pz.find=null;drawCanvas();if(d.type==='sq')renderSQB();renderFb();
 const fb=$('#fb');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});
 const sel=$('#tsel');if(sel&&t&&pct!=null){const o=sel.querySelector(`option[value="${t.id}"]`);if(o&&!t.ai)o.textContent=`${t.t} · ${LVL[t.lvl]||t.lvl} · bestes Ergebnis ${store.drawBest[t.id]}%`;}
}
function renderFb(){const el=$('#fb');if(!el)return;const f=Pz.fb;
 if(!f){el.innerHTML='';return;}
 if(f.empty){el.innerHTML=`<div class="card"><b>Das Feld ist leer.</b> Zeichne zuerst ein Diagramm und starte dann die Prüfung.</div>`;return;}
 const ic={err:'✗',warn:'!',tip:'i'},nmv={err:'Ein Fehler',warn:'Hinweis',tip:'Tipp'};const R=f.R;
 let h=`<div class="card"><h3 style="margin-top:0">🤖 Prüf-Bot</h3>`;
 if(f.pct!=null){const col=f.pct>=85?'var(--ok)':f.pct>=55?'var(--warn)':'var(--bad)';
  const msg=f.pct>=90?'Sehr gut, das ist Prüfungsniveau.':f.pct>=70?'Gut. Es fehlen nur noch Details.':f.pct>=40?'Die Grundlage steht, aber ein Teil der Lösung fehlt oder es gibt Fehler.':'Noch weit von der Lösung entfernt. Lies die Aufgabe noch einmal und öffne den Hinweis unten.';
  h+=`<div class="score"><div class="num" style="color:${col}">${f.pct}%</div><div><b>${msg}</b><br><span class="lvl">Übereinstimmung mit der Musterlösung: ${R.ok} von ${R.total} Punkten. Für Notationsfehler gibt es Abzug.</span></div></div>`;}
 else h+=`<p class="hint" style="margin-bottom:8px">${Pz.task?'Für diese Aufgabe gibt es keine eingebaute Musterlösung. Der Bot hat die Notationsregeln geprüft; ob die Aufgabe erfüllt ist, bewertet der KI-Tutor.':'Freies Zeichnen: Es wurden nur die Notationsregeln geprüft.'}</p>`;
 if(!f.all.length)h+=`<div class="find ok"><b>✓</b><span>Keine Verstöße gegen die Notationsregeln gefunden.</span></div>`;
 f.all.forEach((x,i)=>{const cl=x.ids&&x.ids.filter(Boolean).length;h+=`<div class="find ${x.lv}" ${cl?`onclick="focusFind(${i})" title="Im Feld anzeigen"`:'style="cursor:default"'}><b>${ic[x.lv]}</b><span><b>${nmv[x.lv]}.</b> ${esc(x.t)}${cl?' <span class="lvl">anzeigen ↑</span>':''}</span></div>`;});

function md(s){const inl=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>');
 let h='',list=null;const close=()=>{if(list){h+=`</${list}>`;list=null;}};
 esc(s).split('\n').forEach(l=>{let m;
  if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=='ul'){close();h+='<ul>';list='ul';}h+=`<li>${inl(m[1])}</li>`;}
  else if((m=l.match(/^\s*(\d+)[.)]\s+(.*)/))){if(list!=='ol'){close();h+=`<ol start="${m[1]}">`;list='ol';}h+=`<li>${inl(m[2])}</li>`;}
  else if((m=l.match(/^\s*#{1,6}\s+(.*)/))){close();h+=`<p><b>${inl(m[1])}</b></p>`;}
  else if(/^\s*([-*_])\1{2,}\s*$/.test(l)||!l.trim()){close();}
  else{close();h+=`<p>${inl(l)}</p>`;}});
 close();return h;}
const plain=h=>{const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<\/(p|li|h\d)>/g,'\n').replace(/<li>/g,'- ');return d.textContent.replace(/\n{3,}/g,'\n\n').trim();};

function exGrade(r){let pts=0,max=0;const part={};const res=r.items.map((it,i)=>{const a=r.ans['x:'+i]||{};let p=0,info=null,ty=null;
  if(it.k==='mc'){p=a.c===MODULES.find(m=>m.id===it.m).quiz[it.i].a?1:0;ty=it.m;}
  else if(it.k==='open'){const q=OPEN_Q.find(x=>x.id===it.id);p=openPts(q,a);ty=q.type;}
  else if(it.k==='read'){const t=READ_TASKS.find(x=>x.id===it.id);p=readScore(t,a).pts;ty=t.type;}
  else if(it.k==='find'){const t=FIND_TASKS.find(x=>x.id===it.id),s=findScore(t,a);p=Math.round(s.pts/s.max*it.max*2)/2;ty=t.type;}
  else{const t=baseOf(it.id),d=store.draw['exam-'+i];info=d&&!docEmpty(d)?gradeDoc(d,t):null;p=info&&info.pct!=null?Math.round(info.pct/100*it.max*2)/2:0;ty=t.type;}
  pts+=p;max+=it.max;const g=part[it.k]||(part[it.k]=[0,0]);g[0]+=p;g[1]+=it.max;return {p,info,ty};});

function leitDecks(){const term=[];MODULES.forEach(m=>m.notation.forEach(n=>term.push({id:'t'+hsh(m.id+n.n),f:n.n,sub:m.de,b:(n.s?`<div style="width:190px;margin:0 auto 8px">${n.s}</div>`:'')+n.d})));
 GLOSS_EXTRA.forEach(([t,d])=>term.push({id:'t'+hsh('g'+t),f:t,sub:'Allgemein',b:d}));
 return {term:['Begriffe und Symbole',term],exam:['Prüfungsfragen',OPEN_Q.map(q=>({id:'q'+q.id,f:esc(q.q),sub:BTYPES[q.type]+' · '+q.pts+' P.',b:`<div style="text-align:left">${esc(q.a)}</div>`,ask:'Antworte laut oder im Kopf und vergleiche dann.'}))]};}
function leitDue(cards){const now=Date.now();const due=cards.filter(c=>store.leit[c.id]&&store.leit[c.id].d<=now).sort((a,b)=>store.leit[a.id].b-store.leit[b.id].b);return {due,fresh:cards.filter(c=>!store.leit[c.id])};}
function leitCount(){const D=leitDecks();let n=0;Object.keys(D).forEach(k=>{const x=leitDue(D[k][1]);n+=x.due.length+Math.min(Math.max(0,12-x.due.length),x.fresh.length);});return n;}
function leitStart(deck,more){if(deck)Lt.deck=deck;const x=leitDue(leitDecks()[Lt.deck][1]);Lt.queue=x.due.concat(shuffle(x.fresh).slice(0,more?12:Math.max(0,12-x.due.length)));Lt.shown=false;Lt.done=0;renderLeit();}
function leitAns(ok){const c=Lt.queue.shift();if(!c)return;const r=store.leit[c.id];
 if(ok){const b=Math.min(5,(r?r.b:1)+1);store.leit[c.id]={b,d:Date.now()+LINT[b]*DAY-36e5};Lt.done++;}else{store.leit[c.id]={b:1,d:Date.now()};Lt.queue.push(c);}
 save();Lt.shown=false;renderLeit();}
function renderLeit(){const D=leitDecks();if(!Lt.queue){const x=leitDue(D[Lt.deck][1]);Lt.queue=x.due.concat(shuffle(x.fresh).slice(0,Math.max(0,12-x.due.length)));Lt.shown=false;Lt.done=0;}
 const cards=D[Lt.deck][1],c=Lt.queue[0];const box=[0,0,0,0,0,0];cards.forEach(k=>{const r=store.leit[k.id];box[r?r.b:0]++;});
 let h=`<h1>Lernkarten</h1><p class="sub">Wiederholung nach dem Leitner-System: Eine Karte, die du kannst, wandert ins nächste Fach und kommt nach 1, 3, 7 und 14 Tagen wieder. Ein Fehler schickt sie zurück ins erste Fach.</p>`;
 h+=`<div class="seg">${Object.keys(D).map(k=>`<button class="${k===Lt.deck?'on':''}" onclick="Lt.queue=null;Lt.deck='${k}';renderLeit()">${D[k][0]} · ${D[k][1].length}</button>`).join('')}</div>`;
 h+=`<div class="chips" aria-label="Fächer">${['Neu','Fach 1','Fach 2 · 1 Tag','Fach 3 · 3 Tage','Fach 4 · 7 Tage','Fach 5 · 14 Tage'].map((l,i)=>`<span class="chip" style="cursor:default">${l}: <b>${box[i]}</b></span>`).join('')}</div>`;
 if(!c){const x=leitDue(cards),next=cards.map(k=>store.leit[k.id]).filter(r=>r&&r.d>Date.now()).sort((a,b)=>a.d-b.d)[0];
  h+=`<div class="card result"><div class="big" style="color:var(--ok)">✓</div><p><b>Für heute ist in diesem Stapel alles wiederholt.</b>${Lt.done?` In diesem Durchgang: ${Lt.done}.`:''}</p>${next?`<p class="lvl">Nächste Wiederholung: ${new Date(next.d).toLocaleDateString('de-DE')}.</p>`:''}
  <p class="row" style="justify-content:center">${x.fresh.length?`<button class="btn primary" onclick="leitStart(null,true)">Weitere ${Math.min(12,x.fresh.length)} neue</button>`:''}${Object.keys(D).filter(k=>k!==Lt.deck).map(k=>`<button class="btn" onclick="Lt.queue=null;Lt.deck='${k}';renderLeit()">${D[k][0]}</button>`).join('')}</p></div>`;$('#main').innerHTML=h;return;}
 const r=store.leit[c.id];
 h+=`<div class="card lcard"><div class="qhead"><span>${c.sub} · ${r?'Fach '+r.b:'neu'}</span><span>noch ${Lt.queue.length}</span></div><div class="lfront">${c.f}</div>`;
 h+=Lt.shown?`<div class="lback">${c.b}</div><p class="row" style="justify-content:center;margin:14px 0 0"><button class="btn" style="border-color:var(--bad)" onclick="leitAns(false)">✗ Nicht gewusst <span class="lvl">(1)</span></button><button class="btn primary" onclick="leitAns(true)">✓ Gewusst <span class="lvl" style="color:inherit">(2)</span></button></p>`
  :`<p class="lvl" style="text-align:center">${c.ask||'Überlege, was das ist und wie es aussieht.'}</p><p style="text-align:center;margin:14px 0 0"><button class="btn primary" onclick="Lt.shown=true;renderLeit()">Antwort zeigen <span class="lvl" style="color:inherit">(Leertaste)</span></button></p>`;
 $('#main').innerHTML=h+`</div>`;}
document.addEventListener('keydown',e=>{if(route.page!=='cards'||!Lt.queue||!Lt.queue.length)return;const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
 if(e.key===' '&&!Lt.shown){e.preventDefault();Lt.shown=true;renderLeit();}else if(Lt.shown&&e.key==='1')leitAns(false);else if(Lt.shown&&e.key==='2')leitAns(true);});
function todayCard(){const due=leitCount(),ws=weakQuestions().length,ts=topicStats().filter(v=>v.total!=null).sort((a,b)=>a.total-b.total)[0];
 return `<div class="card" style="border-left:4px solid var(--st)"><h3 style="margin-top:0">🎯 Für heute</h3><ul class="clean"><li>Lernkarten zur Wiederholung: <b>${due}</b></li><li>Fragen mit Fehlern: <b>${ws}</b></li>${ts?`<li>Schwächstes Thema: <b>${ts.m.de}</b> (${ts.total}%)</li>`:''}</ul><p class="row" style="margin:8px 0 0"><button class="btn primary" onclick="go('cards')">Lernkarten wiederholen</button><button class="btn" onclick="go('weak')">Schwachstellen</button></p></div>`;}

/* ---------- Dateien speichern: online über die Download-Funktion der Seite, in der lokalen Datei als normaler Download ---------- */
let DL=null;(async()=>{try{if(window.claude&&typeof window.claude.use==='function')DL=await window.claude.use('downloads');}catch(e){}})();
const inClaude=()=>!!(window.claude&&typeof window.claude.use==='function');
async function saveFile(name,blob){if(DL){try{await DL.save({filename:name,data:blob});return 'ok';}catch(e){return e&&e.code==='declined'?'declined':'fail';}}
 if(inClaude())return 'fail';
 try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return 'ok';}catch(e){return 'fail';}}
const dstamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());};
function copyText(text,ta,done){const sel=()=>{if(ta){ta.focus();ta.select();}};try{navigator.clipboard.writeText(text).then(()=>done(true),()=>{sel();let ok=false;try{ok=document.execCommand('copy');}catch(_){}done(ok);});}catch(e){sel();let ok=false;try{ok=document.execCommand('copy');}catch(_){}done(ok);}}

/* ---------- Sicherung: Export / Import ---------- */
let Imp=null;
function backupData(){if(typeof flushDoc==='function'&&$('#cv'))flushDoc();const s=JSON.parse(JSON.stringify(store));delete s.examRun;return {app:'uml-trainer',v:3,at:Date.now(),store:s};}
function backupInfo(s){const n=o=>o&&typeof o==='object'?Object.keys(o).length:0;return `Zeichnungen: ${n(s.draw)}, Zeichenergebnisse: ${n(s.drawBest)}, Pool-Aufgaben: ${n(s.bank)}, Prüfungen: ${(s.examHist||[]).length}, Lernkarten in Wiederholung: ${n(s.leit)}`;}
function renderData(){Imp=null;
 let h=`<h1>Sicherung</h1><p class="sub">Fortschritt, Zeichnungen, Antworten und Statistik liegen nur in diesem Browser. Die Datei auf dem Computer und die Online-Version führen den Fortschritt getrennt. Die Sicherung dient dazu, nichts zu verlieren und den Fortschritt zwischen beiden zu übertragen.</p>`;
 h+=`<div class="card"><h3 style="margin-top:0">Speichern</h3><p>Aktuell im Programm: ${backupInfo(store)}.</p><p class="row" style="margin:0"><button class="btn primary" onclick="doExport()">⬇ Sicherung als Datei speichern</button><button class="btn" onclick="doExportText()">📋 Sicherung als Text kopieren</button><span class="lvl" id="expmsg" aria-live="polite"></span></p><textarea id="exptext" rows="5" readonly hidden aria-label="Sicherung als Text" style="margin-top:10px"></textarea></div>`;
 h+=`<div class="card"><h3 style="margin-top:0">Wiederherstellen</h3><p>Wähle die Sicherungsdatei <code>uml-trainer-backup-….json</code> oder füge den Text der Sicherung ein. Der aktuelle Fortschritt wird vollständig ersetzt.</p>
 <p class="row"><input type="file" id="impfile" accept=".json,application/json" onchange="impFile(this)" aria-label="Sicherungsdatei"></p>
 <details><summary>Sicherung als Text einfügen</summary><textarea id="imptext" rows="5" placeholder='{"app":"uml-trainer", …}' aria-label="Text der Sicherung" style="margin-top:8px"></textarea><p style="margin:8px 0 0"><button class="btn" onclick="impParse($('#imptext').value)">Text einlesen</button></p></details>
 <div id="impbox" aria-live="polite"></div></div>`;
 h+=`<div class="card"><h3 style="margin-top:0">Diagramm als Bild speichern</h3><p style="margin:0">Im Bereich «Praxis» gibt es unter dem Editor die Schaltfläche «🖼 Als Bild speichern»: Sie speichert deine Zeichnung als PNG, zum Beispiel um sie der Lehrkraft zu zeigen.</p></div>`;
 $('#main').innerHTML=h;}
async function doExport(){const m=$('#expmsg'),r=await saveFile('uml-trainer-backup-'+dstamp()+'.json',new Blob([JSON.stringify(backupData())],{type:'application/json'}));
 if(m)m.textContent=r==='ok'?'Fertig. Die Datei liegt im Download-Ordner.':r==='declined'?'Speichern abgebrochen.':'In diesem Fenster ließ sich die Datei nicht speichern. Nutze «Sicherung als Text kopieren».';}
function doExportText(){const ta=$('#exptext'),m=$('#expmsg');ta.value=JSON.stringify(backupData());ta.hidden=false;copyText(ta.value,ta,ok=>{if(m)m.textContent=ok?'Kopiert. Füge den Text in eine Datei oder Notiz ein.':'Der Text ist unten markiert. Drücke Strg+C und speichere ihn.';});}
function impFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>impParse(String(rd.result));rd.onerror=()=>impParse('');rd.readAsText(f);}
function impParse(txt){const box=$('#impbox');let d=null;try{d=JSON.parse(txt);}catch(e){}
 if(!d||d.app!=='uml-trainer'||!d.store||typeof d.store!=='object'||Array.isArray(d.store)){Imp=null;if(box)box.innerHTML=`<div class="find warn" style="cursor:default"><b>!</b><span>Das ist keine UML-Trainer-Sicherung oder die Datei ist beschädigt. Es wurde nichts geändert.</span></div>`;return;}
 Imp=d;if(box)box.innerHTML=`<div class="tip"><b>Sicherung vom ${new Date(d.at||0).toLocaleString('de-DE')}.</b><br>In der Sicherung: ${backupInfo(d.store)}.<br>Aktuell im Programm: ${backupInfo(store)}.<p style="margin:10px 0 0"><button class="btn primary" data-label="Aktuellen Fortschritt ersetzen" onclick="impApply(this)">Aktuellen Fortschritt ersetzen</button></p></div>`;}
function impApply(b){if(!Imp)return;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Noch einmal klicken: Der aktuelle Fortschritt wird ersetzt';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent=b.dataset.label;}},4000);return;}
 const run=store.examRun;store=Object.assign({best:{},comp:{},seen:{}},JSON.parse(JSON.stringify(Imp.store)));delete store.examRun;if(run&&!run.done)store.examRun=run;storeFix();Pz.doc=null;Pz.key=null;Pz.task=null;Bk.ans={};Lt.queue=null;Imp=null;save();
 $('#main').innerHTML=`<h1>Sicherung</h1><div class="card result"><div class="big" style="color:var(--ok)">✓</div><p><b>Fortschritt wiederhergestellt.</b></p><p><button class="btn primary" onclick="go('home')">Zur Startseite</button></p></div>`;renderNav();}

/* ---------- Diagramm als Bild ---------- */
function exportSVG(doc){const raw=svgOf(doc),m=raw.match(/viewBox="0 0 (\d+) (\d+)"/),w=+m[1],h=+m[2],inner=raw.replace(/^<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'');
 const defs=document.querySelector('svg defs').innerHTML;
 const css='svg{--ink:#1d2433;--card:#fff;--accent:#2f5bd3;--accent-soft:#e6ecfb;--bad:#c23b3b;--line:#d9d6cc}text{fill:#1d2433;stroke:none;font-family:"Segoe UI",system-ui,Arial,sans-serif}.s{stroke:#1d2433;fill:none;stroke-width:1.4}.d{stroke-dasharray:5 3}.f{fill:#1d2433;stroke:#1d2433}.w{fill:#fff;stroke:#1d2433;stroke-width:1.4}.acc{fill:#2f5bd3;stroke:none}.mk{stroke:#1d2433;fill:none;stroke-width:1.3}.mkf{fill:#1d2433;stroke:#1d2433}.mkw{fill:#fff;stroke:#1d2433;stroke-width:1.3}text.lbl{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.hit{stroke:none;fill:none}.lanehead{fill:#e6ecfb;stroke:#1d2433;stroke-width:1.4}.handle{display:none}';
 return {w,h,svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><style>${css}</style><defs>${defs}</defs><rect width="100%" height="100%" fill="#fff"/>${inner}</svg>`};}
function svgToPng(svg,w,h){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{try{const s=2,c=document.createElement('canvas');c.width=w*s;c.height=h*s;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png');}catch(e){rej(e);}};img.onerror=()=>rej(new Error('img'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
async function saveImage(){const m=$('#imgmsg'),box=$('#imgbox'),d=Pz.doc;const say=t=>{if(m)m.textContent=t;};if(box)box.innerHTML='';
 if(!d||docEmpty(d)){say('Das Feld ist leer, es gibt nichts zu speichern.');return;}
 say('Bild wird vorbereitet…');const x=exportSVG(d),name='uml-'+d.type+'-'+(Pz.task?Pz.task.id:'frei')+'-'+dstamp();let blob=null;
 try{blob=await svgToPng(x.svg,x.w,x.h);}catch(e){}
 const r=blob?await saveFile(name+'.png',blob):await saveFile(name+'.svg',new Blob([x.svg],{type:'image/svg+xml'}));
 if(r==='ok'){say('Fertig. Das Bild liegt im Download-Ordner.');return;}
 if(r==='declined'){say('Speichern abgebrochen.');return;}
 say('In diesem Fenster ließ sich die Datei nicht speichern. Das Bild wird unten angezeigt: Klicke mit der rechten Maustaste darauf und wähle «Bild speichern».');
 if(box){const url=blob?URL.createObjectURL(blob):'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x.svg);box.innerHTML=`<div class="figure"><img src="${url}" alt="Diagramm"></div>`;}}

render();
</script>
</body>
